[`Émile Durkheim`,`Representante del positivismo: concibe al humano como objeto, y a los fenómenos sociales como "cosas" con influencia externa.`,`Estudiar el suicidio a partir de tasas y estadísticas sociales, como hizo Durkheim.`,`Durkheim: el humano como objeto.`],
[`Max Weber`,`Propone un punto medio entre comprensión y explicación: una ciencia que aspira a la comprensión interpretativa de la acción social para obtener la explicación causal de su curso y efectos.`,`Entender por qué alguien actúa de cierta manera para luego explicar el patrón social.`,`Weber: comprender para explicar.`],
[`Edmund Husserl`,`Fundador de la fenomenología: concibe al humano como sujeto de sentido, cuya realidad es específica e irreductible a lo físico.`,`Preguntar a una persona qué significó para ella superar una enfermedad, no solo medir su recuperación física.`,`Husserl: el humano como sujeto de sentido.`],
[`Realidad empírica`,`Lo objetivo y material, basado en lo que se percibe a través de los sentidos; el conocimiento se construye observando la manifestación física del fenómeno.`,`Contar el número de viviendas de zinc en un barrio y describir los materiales de construcción.`,`Empírica: lo tangible y medible.`],
[`Realidad epistémica`,`La construcción cultural de la realidad; requiere un sujeto cognoscente y está influenciada por la cultura, el contexto y las relaciones sociales.`,`Interpretar que las casas de zinc reflejan desigualdad estructural y resiliencia comunitaria.`,`Epistémica: el significado construido.`]],

[[`Modelo cuantitativo (S→O)`,`El investigador se distancia del objeto de estudio; la no interacción es condición de rigor y permite excluir juicios valorativos.`,`Aplicar una encuesta estandarizada sin involucrarse personalmente con los participantes.`,`Cuantitativo: distancia y no interacción.`],
[`Modelo cualitativo (S⇄O)`,`El conocimiento es una creación compartida mediante la interacción; es necesario "meterse en la realidad" del fenómeno estudiado.`,`Convivir varias semanas con una comunidad para comprender su forma de vida.`,`Cualitativo: interacción y creación compartida.`],
[`Ruta cuantitativa`,`Se construye desde la estadística, con uso estructurado de métodos y herramientas de recolección; se valida mediante comprobación de hipótesis y análisis numérico; la teoría guía y es punto de partida.`,`Diseñar una encuesta con hipótesis previas y analizar los resultados con estadística.`,`Cuantitativa: hipótesis → números → validación.`],
[`Ruta cualitativa`,`Se construye a partir de hallazgos sucesivos durante la investigación; se valida a través del diálogo, la interacción continua y la vivencia en campo; la teoría es la meta final, no el punto de partida.`,`Ir ajustando las preguntas de una entrevista según lo que se va descubriendo en el campo.`,`Cualitativa: hallazgos → diálogo → teoría al final.`],
[`Perfil cualitativo del investigador`,`Se caracteriza por lo epistémico, la interacción, lo interpretativo y las cualidades del fenómeno, frente al perfil cuantitativo (empírico, objetivo, numérico, distante).`,`Un investigador cualitativo interpreta el sentido de un relato en lugar de solo contar palabras clave.`,`Cualitativo: epistémico, interactivo, interpretativo.`]],

[[`Características del investigador cualitativo`,`Subjetividad, sensibilidad, capacidad interactiva, flexibilidad, empatía, manejo de etapas circulares e interpretación bidireccional frente a los datos.`,`Cambiar el rumbo de una entrevista al notar que el participante quiere hablar de otro tema relevante.`,`Flexible, empático, interpretativo y circular.`],
[`Problema de investigación`,`Cuestión compleja que requiere una solución; un hecho no resuelto que debe encontrar una respuesta teórica, práctica o científica.`,`La falta de estudios sobre cómo los jóvenes de una comunidad viven el desplazamiento forzado.`,`Problema: hecho no resuelto que exige respuesta.`],
[`Criterio filosófico y científico del problema`,`El criterio filosófico se basa en antecedentes históricos; el criterio científico es la expresión objetiva de la necesidad de desarrollar conocimiento científico.`,`Justificar un estudio citando investigaciones previas y un vacío de conocimiento.`,`Filosófico: antecedentes. Científico: vacío de conocimiento.`],
[`El planteamiento del problema`,`Delimita la dirección y el propósito del estudio, identificando el camino a seguir y las deficiencias de conocimiento por cubrir; se apoya en un contexto conceptual construido a partir de la experiencia del investigador y estudios previos.`,`Antes de investigar una cultura indígena, conocer su ubicación, historia, religión y economía.`,`Planteamiento: dirección + propósito + contexto conceptual.`],
[`La pregunta de investigación`,`El corazón del diseño; indica qué se desea saber y hacia dónde va la investigación. Debe ser modificable, clara y delimitada en tiempo y espacio para poder responderse.`,`"¿Cómo perciben los docentes las dinámicas de estrés laboral en su práctica pedagógica?"`,`La pregunta: el corazón del diseño.`],
[`La paradoja cualitativa`,`Presentar interrogantes que son solicitados por las agencias financiadoras pero que a la vez admiten flexibilidad en el proceso.`,`Un proyecto financiado exige una pregunta definida desde el inicio, aunque el enfoque cualitativo permita ajustarla en el camino.`,`La paradoja: rigidez del financiador vs flexibilidad cualitativa.`],
[`Objetivos generales y específicos`,`Los objetivos generales enmarcan toda la investigación; los específicos señalan los pasos exactos a seguir para alcanzar el objetivo general.`,`General: comprender las vivencias de pacientes jóvenes. Específicos: explorar significados del diagnóstico, identificar apoyo familiar.`,`General: enmarca. Específicos: pasos exactos.`],
[`Espectro de alcances (scope spectrum)`,`Gama de alcances de un estudio: exploratoria, descriptiva, explicativa, predictivos, de intervención y de evaluación.`,`Un primer acercamiento a un fenómeno nuevo corresponde a un alcance exploratorio.`,`Explorar → describir → explicar → predecir → intervenir → evaluar.`]],

[[`Fenomenología`,`Enfoque cualitativo fundado por Edmund Husserl que asume la investigación sistemática de la subjetividad y del mundo de la vida cotidiana.`,`Estudiar cómo vive una persona el duelo, desde su propia narración de la experiencia.`,`Fenomenología: subjetividad y vida cotidiana.`],
[`Tareas del investigador fenomenológico`,`Estudiar las esencias, explorar el significado del ser, conocer significados particulares interpretando cómo los narran los sujetos (Van Manen, 1990), y reflexionar sobre la conciencia.`,`Preguntar a varios pacientes cómo viven su enfermedad para encontrar el significado esencial compartido.`,`Esencias, significado del ser, narración de los sujetos.`],
[`Épóché`,`Concepto clave de la fenomenología: suspender de forma sistemática e intencional las creencias del investigador para captar el fenómeno libre de interpretación teórica previa.`,`Un investigador deja de lado sus supuestos sobre la maternidad antes de entrevistar a nuevas madres.`,`Épóché: suspender las propias creencias.`],
[`Hermenéutica`,`Enfoque que interpreta discursos y acciones reconstruyendo la intención del autor, analizando el contexto cultural e histórico de los sujetos.`,`Interpretar una entrevista teniendo en cuenta el momento histórico y cultural en que fue dicha.`,`Hermenéutica: interpretar discurso y contexto.`],
[`Círculo hermenéutico`,`Dinámica en la que el investigador transita constantemente entre las partes (fragmentos, relatos, palabras) y el todo (comprensión global y contexto cultural) para lograr una interpretación coherente.`,`Releer varias veces una entrevista completa y luego frases sueltas para entender mejor el sentido general.`,`Círculo: de las partes al todo y del todo a las partes.`]],

[[`Etnografía`,`Forma cualitativa de investigación que describe, traduce, explica e interpreta las realidades socioculturales de un grupo humano que comparte un entorno o una filosofía común.`,`Convivir con una comunidad indígena para describir sus costumbres y creencias.`,`Etnografía: describir la cultura de un grupo.`],
[`Etnografías críticas`,`Tipo de etnografía que estudia de forma prioritaria a grupos marginados para contribuir a resolver injusticias e inequidades (Madison, 2011).`,`Investigar las condiciones de vida de una comunidad desplazada para visibilizar sus derechos vulnerados.`,`Críticas: grupos marginados e injusticias.`],
[`Investigación-Acción Participativa (IAP)`,`Enfoque creado por Orlando Fals Borda que rompe con la investigación positivista tradicional; busca resolver problemas prácticos de una comunidad y transformarla mediante la acción colaborativa.`,`Trabajar junto a una comunidad para construir e implementar soluciones a un problema que ellos mismos identificaron.`,`IAP: investigar y transformar juntos.`],
[`Sigla IAP`,`I: Investiga. A: Acciones de forma interventiva. P: Participan absolutamente todos.`,`Un proyecto donde la comunidad, y no solo el investigador, decide qué acciones tomar.`,`I-A-P: investigar, actuar, participar todos.`],
[`Relación sujeto-sujeto en la IAP`,`Principio de horizontalidad democrática: no existe una relación asimétrica o de poder entre el investigador y la comunidad.`,`El investigador se sienta como un miembro más en las asambleas comunitarias, no como autoridad.`,`Sujeto-sujeto: horizontalidad, no jerarquía.`],
[`Fases de la IAP`,`Sensibilización (motivación e inserción), problematización y diagnóstico (identificar necesidades), plan de acción (formular y ejecutar estrategias) y evaluación permanente (monitoreo y ajuste).`,`Una comunidad primero se sensibiliza, luego diagnostica su problema de agua potable y diseña un plan de acción.`,`Sensibilizar → diagnosticar → actuar → evaluar.`]],

[[`Teoría Fundamentada`,`Abordaje cualitativo de diseño emergente y flexible cuyo propósito es producir una teoría explicativa que nace directamente de los datos empíricos en su contexto natural (Hernández-Sampieri y Mendoza, 2018).`,`Construir una teoría sobre el afrontamiento de enfermos a partir de las entrevistas, sin partir de una teoría previa.`,`Teoría Fundamentada: la teoría nace de los datos.`],
[`Teorías sustantivas`,`Teorías que se aplican a un contexto, población o área temática específica; surgen directamente del trabajo de campo situado.`,`La teoría del cuidado de enfermos de Morse (1999), centrada en el afrontamiento en hospitales.`,`Sustantivas: específicas de un contexto.`],
[`Teorías formales`,`Teorías con mayor nivel de abstracción que aplican a rangos amplios de situaciones sociales, biológicas o físicas.`,`La teoría de la atribución social, aplicable a muchos contextos de psicología social.`,`Formales: amplia abstracción.`],
[`Diseño sistemático (Strauss & Corbin)`,`Variante estructurada y rigurosa de la Teoría Fundamentada; usa codificación abierta, axial y selectiva guiada por un paradigma codificador de causas, condiciones y consecuencias.`,`Codificar cada entrevista siguiendo categorías predefinidas de causas y efectos.`,`Sistemático: estructurado, paradigma codificador.`],
[`Diseño emergente (Glaser)`,`Variante fluida y libre de la Teoría Fundamentada; critica la rigidez del diseño sistemático por "forzar" los datos, dejando que la teoría surja de manera espontánea.`,`Dejar que las categorías se conecten libremente sin encasillarlas en un esquema fijo.`,`Emergente: fluido, sin forzar los datos.`],
[`Diseño constructivista (Charmaz)`,`Variante interpretativa y reflexiva; enfatiza la intersubjetividad, entendiendo la teoría como una co-construcción entre investigador y participantes.`,`Reconocer que la teoría final refleja tanto la voz de los participantes como la interpretación del investigador.`,`Constructivista: teoría co-construida.`],
[`Codificación abierta`,`Primer nivel de codificación: fragmentación línea por línea de los datos brutos para identificar conceptos preliminares.`,`Etiquetar la frase "me encierro en casa por las peleas de mis tíos" como "conflicto intrafamiliar".`,`Abierta: fragmentar y etiquetar.`],
[`Codificación axial`,`Segundo nivel: interconexión de las categorías creadas en torno a un eje explicativo central, usando causas, condiciones y estrategias.`,`Conectar "violencia familiar" (causa) con "refugio en la plaza" (estrategia) y "identidad Kasimba" (consecuencia).`,`Axial: conectar categorías entre sí.`],
[`Codificación selectiva`,`Tercer nivel: selección de una única categoría central que integra todas las categorías en una narrativa lógica, generando la teoría emergente final.`,`"La práctica dancística como trinchera y espacio de resignificación de la identidad joven" del grupo Kasimba.`,`Selectiva: una categoría central que lo integra todo.`]],

[[`Caso Kasimba`,`Estudio de caso enfocado en el significado y la pertenencia organizacional; explora qué significa el trabajo para la profesora Iveth y cómo perciben los jóvenes su pertenencia a la organización.`,`Entrevistar a los jóvenes de Kasimba sobre lo que significa para ellos formar parte del grupo de danza.`,`Kasimba: significado y pertenencia.`],
[`Fórmula de la pregunta problema`,`[Verbo exploratorio] + [fenómeno central] + [participantes] + [contexto/ambiente]; debe indicar qué se desea saber y la dirección de la investigación.`,`"¿Cómo perciben y significan los docentes de psicología las dinámicas de estrés laboral en sus prácticas pedagógicas?"`,`Verbo + fenómeno + participantes + contexto.`],
[`Rúbrica del día 3 (Caso Kasimba)`,`Directrices: seleccionar de manera rigurosa una problemática psicosocial del caso, formular la pregunta de investigación cualitativa y escoger un diseño cualitativo para abordarla.`,`Elegir la Teoría Fundamentada como diseño para explicar el significado de la danza en los jóvenes de Kasimba.`,`Seleccionar problema → formular pregunta → escoger diseño.`],
[`Lectura obligatoria de la sumativa del Corte 1`,`Capítulo 14, "Elección del diseño en la ruta cualitativa" (Hernández Sampieri y Mendoza, 2023), además de la lectura del caso Kasimba y su referente teórico.`,`Leer el capítulo antes de decidir qué diseño cualitativo usar para el caso Kasimba.`,`Cap. 14: elección del diseño cualitativo.`]]
];

{n:`Inicio`,ic:`⚖️`,lead:`Ética, Multiculturalidad y Diversidad · Corte 1 · Fundamentos epistemológicos y teóricos de la bioética`,c:[
[`¿De qué trata este corte?`,[`Parte de la distinción entre ética, moral y ley, recorre las grandes teorías éticas y el desarrollo moral, y aterriza en el marco normativo colombiano que regula el ejercicio profesional de la Psicología: la Ley 1090 de 2006, el secreto profesional, la confidencialidad y el consentimiento informado.`]],
[`Idea central`,[`Lo legal no siempre es ético, ni lo ético siempre es moral: son tres registros distintos (individual, social y normativo) que en la práctica profesional del psicólogo deben dialogar constantemente.`]],
[`Ruta de estudio`,[[`Ética, moral y ley`,`Distinciones de Savater, libertad y buena vida, código penal.`],[`Teorías éticas`,`Virtud, utilitarismo, ética kantiana, ética del cuidado, ética discursiva.`],[`Desarrollo moral`,`Piaget, Kohlberg y Rest: de la heteronomía a los principios universales.`],[`Estética y ética`,`Cómo lo estético moldea juicios y sensibilidades morales.`],[`Principios éticos APA`,`Beneficencia, fidelidad, integridad, justicia, respeto por la dignidad.`],[`Ley 1090 de 2006`,`Derechos, deberes y prohibiciones de los/las psicólogos(as).`],[`Secreto profesional`,`Derecho y deber, salvedades y la doctrina del mal menor.`],[`Confidencialidad e historia clínica`,`Registro de las acciones profesionales y su custodia.`],[`Consentimiento informado`,`Definición, fundamento y tipos según la edad y la capacidad.`],[`Deontología y tribunales`,`Cómo opera el proceso disciplinario en Colombia.`],[`Casos para el panel de expertos`,`Tres situaciones reales para aplicar las teorías éticas.`]]]]},

{n:`Ética, moral y ley`,ic:`🧭`,lead:`Tres formas distintas de responder a la pregunta "¿qué debo hacer?" (Savater, 2000).`,c:[
[`Tres nociones distintas`,[[`Moral`,`Criterio que diferencia el bien del mal; los criterios con que una persona divide sus intenciones, creencias, decisiones y acciones entre buenas y malas.`],[`Ética`,`Ciencia que estudia la moral con pretensiones de presentar sistemas teóricos que den cuenta de la división concreta entre conductas buenas y malas. Al orientarse hacia lo bueno y la conciencia individual, no puede exigirse de manera general, a diferencia de la deontología.`],[`Ley`,`Norma con poder coercitivo dentro de un sistema de derecho. Puede tratar los mismos temas que las normas morales, pero es de obligatorio cumplimiento y su incumplimiento implica sanciones.`]]],
[`Base individual vs. base social`,[[`Ética`,`Base individual · de la filosofía · teórica · reflexión interna.`],[`Moral`,`Base social · de las costumbres · práctica · influencia externa.`]]],
[`Libertad y voluntad (Savater)`,[`"No somos libres de elegir lo que nos pasa, sino libres de elegir cómo hacer frente a lo que nos pasa".`,`"No somos libres de no ser libres" (Savater) / "Estamos condenados a la libertad" (Sartre).`,`"Nadie puede ser libre en mi lugar, nadie puede dispensarme de elegir y de buscar por mí mismo".`]],
[`La "buena vida" y sus riesgos`,[`"Nunca una acción es buena sólo por ser una orden, una costumbre o un capricho".`,`"La buena vida humana es buena vida entre humanos; de lo contrario puede que sea vida, pero no será buena ni humana".`,`"Darse la buena vida no puede ser algo distinto que dar la buena vida" (Savater, 2010).`]],
[`Código Penal · Ley 599 de 2000`,[[`Art. 1°`,`Dignidad humana: el derecho penal tiene como fundamento el respeto a la dignidad humana.`],[`Art. 3°`,`Las sanciones responden a los principios de necesidad, proporcionalidad y razonabilidad.`],[`Art. 4°`,`Funciones de la pena: prevención general, retribución justa, prevención especial, reinserción social y protección al condenado.`],[`Art. 5°`,`Funciones de la medida de seguridad: protección, curación, tutela y rehabilitación.`]]]],
x:[`<b>Clave del corte:</b> "Lo legal no siempre es ético, ni lo ético siempre moral". La Ley 1090 (más adelante) es la norma; el secreto profesional puede ser, además, un dilema ético cuando la norma no basta.`]},

{n:`Teorías éticas`,ic:`📚`,lead:`Cinco perspectivas para fundamentar lo éticamente correcto, tomar decisiones y entender el lugar del sujeto moral.`,c:[
[`Guía para leer cada perspectiva`,[[`1 · Fundamento`,`¿De dónde viene el criterio para decir que algo está bien o mal? (deber, consecuencias, virtudes, cuidado, diálogo/consenso).`],[`2 · Toma de decisiones`,`¿Qué debería preguntarse o considerar una persona ante un dilema moral?`],[`3 · Lugar del otro`,`¿Qué importancia concede a las personas, las relaciones, las circunstancias y el contexto?`],[`4 · Buena decisión`,`¿Qué resultado o forma de actuar se consideraría moralmente adecuada? ¿Qué privilegia y qué deja en segundo plano?`]]],
[`Ética de la virtud (Aristóteles)`,[`El fundamento no es una regla ni una consecuencia, sino el carácter: actuar según virtudes (prudencia, justicia, templanza) que se cultivan con la práctica hasta convertirse en hábito.`,`Pregunta clave: ¿qué haría una persona virtuosa en esta situación?`,`Límite a discutir: puede resultar poco operativa cuando hay que decidir con urgencia, sin tiempo para el hábito o la deliberación prolongada.`]],
[`Utilitarismo (Jeremy Bentham)`,[`Lo correcto es lo que maximiza el bienestar y minimiza el daño para el mayor número de personas; la razón instruye sobre las tendencias útiles y beneficiosas de las acciones (Hume).`,`Pregunta clave: ¿qué opción produce el mejor balance de beneficios sobre daños para todos los afectados?`,`Límite a discutir: puede justificar sacrificar a una minoría si el resultado agregado es positivo.`]],
[`Ética Kantiana`,[`Lo correcto se funda en el deber y en principios universalizables (imperativo categórico): actúa solo según la máxima que podrías querer que se vuelva ley universal.`,`Pregunta clave: ¿podría esta acción convertirse en norma para cualquier persona en cualquier situación similar?`,`Límite a discutir: puede ser rígida frente a contextos particulares o conflictos entre deberes.`]],
[`Ética del cuidado`,[`Parte de las relaciones, la empatía y la interdependencia, no de reglas abstractas ni de cálculos de utilidad; enfoque feminista que valora el vínculo y la vulnerabilidad.`,`Pregunta clave: ¿qué respuesta cuida mejor la relación y las necesidades concretas de las personas involucradas?`,`Límite a discutir: puede quedar en tensión con la imparcialidad que exige la justicia.`]],
[`Ética discursiva (Habermas)`,[`Lo correcto se valida mediante el diálogo racional y el consenso entre todos los afectados, en condiciones de igualdad y sin coacción.`,`Pregunta clave: ¿esta norma sería aceptada por todos los afectados en un diálogo libre y racional?`,`Reformula el desarrollo moral de Kohlberg desde la intersubjetividad y la comunicación.`]]],
x:[`<b>Para el panel de expertos:</b> cada perspectiva responde distinto a "¿en qué se fundamenta lo correcto?", "¿cómo se decide?", "¿qué lugar ocupan las personas y el contexto?" y "¿qué sería una buena decisión?".`]},

{n:`Desarrollo moral`,ic:`🧠`,lead:`Piaget, Kohlberg y Rest: de la moral heterónoma impuesta desde fuera a los principios éticos autónomos y universales.`,c:[
[`Piaget (1974)`,[[`Moral heterónoma`,`Pensamiento concreto; normas externas impuestas por una autoridad.`],[`Moral autónoma`,`Relaciones de igualdad; convencionalidad de la norma, construida entre pares.`]]],
[`Kohlberg (1969, 1986) · Nivel pre-convencional`,[[`M. Heterónoma`,`Orientación de castigo y obediencia; perspectiva egocéntrica.`],[`Individualismo e intercambio`,`Orientación instrumental y relativista; perspectiva individualista y concreta.`]]],
[`Kohlberg · Nivel convencional`,[[`Expectativas interpersonales`,`Orientación del "niño bueno"; perspectiva individual con respecto al otro.`],[`Sistema social y conciencia`,`Orientación de ley y orden; perspectiva social o interpersonal.`]]],
[`Kohlberg · Nivel post-convencional`,[[`Contrato social y derechos`,`Orientación legalista del contrato social; perspectiva anterior a la sociedad.`],[`Principios éticos universales`,`Orientación a principios éticos universales; perspectiva moral que parte de acuerdos sociales.`]]],
[`Rest (1979, 1986)`,[[`Esquema de intereses primarios`,`Cooperación social → relaciones micro-morales; intereses personales acordes a las consecuencias.`],[`Esquema de mantenimiento`,`Perspectiva sociocéntrica; se considera la forma en que el otro pueda cooperar.`],[`Esquema post-convencional`,`Ideales + coherencia lógica; obligaciones + ideales recíprocos y compartidos.`]]]],
x:[`Los tres autores describen la misma trayectoria con distinto vocabulario: de obedecer una norma externa por miedo al castigo, a sostener principios propios que se justifican racional y universalmente.`]},

{n:`Estética y ética`,ic:`🎨`,lead:`La estética no es neutral: también moldea los juicios, las sensibilidades y las decisiones éticas.`,c:[
[`Preguntas que abre`,[`¿Qué consideramos bello, normal o deseable? ¿Quién decide y con qué criterios? ¿Qué formas de vida se hacen visibles, legítimas o valiosas? ¿Qué queda fuera de la imagen y del reconocimiento?`]],
[`Aportes clave`,[[`Amplía la comprensión`,`De lo moral y lo ético más allá de las normas: incluye emociones, percepciones, imaginarios y la forma en que habitamos y significamos el mundo.`],[`Revela el poder`,`De los cánones estéticos en la construcción de lo aceptable, lo legítimo y lo humano, reproduciendo jerarquías o abriendo posibilidades de dignidad.`],[`Invita a una ética de la representación`,`Que cuestiona estereotipos y exclusiones, y promueve imágenes, relatos y prácticas que cuidan la dignidad y la diversidad.`],[`Conecta sensibilidad y razón`,`Una ética crítica y reflexiva necesita también una mirada estética consciente y responsable.`]]],
[`Citas que sustentan esta reflexión`,[`"La representación transforma la manera en que somos vistos y la manera en que nos vemos" (hooks, 1992).`,`"El poder produce realidad; produce dominio de objetos y rituales de verdad" (Foucault, 1975).`,`"Los gustos son inseparables de las posiciones ocupadas en el espacio social" (Bourdieu, 1979).`,`"La educación debe ampliar la capacidad de ver al otro como un igual" (Nussbaum, 2001).`]]]},

{n:`Principios éticos APA`,ic:`🛡️`,lead:`Estándares y principios éticos (Ley 1090): los Principios Generales son aspiracionales, no obligaciones sancionables como los Estándares Éticos.`,c:[
[`Del Código de Ética`,[`Está destinado a cubrir la mayoría de las situaciones encontradas por los psicólogos; busca el bienestar y la protección de individuos y grupos, y la educación de miembros, estudiantes y público sobre estándares éticos.`,`Admite que actuar éticamente requiere compromiso personal y un esfuerzo de por vida.`]],
[`Beneficencia y no maleficencia`,[`Beneficiar a quienes se trabaja y cuidar de no hacer daño; salvaguardar el bienestar y los derechos de las personas y de los animales sujetos de investigación.`,`Estar alerta ante factores personales, financieros, sociales u organizativos que puedan llevar al mal uso de la influencia profesional.`]],
[`Fidelidad y responsabilidad`,[`Establecer relaciones de confianza; asumir la responsabilidad apropiada por el propio comportamiento y manejar los conflictos de interés.`,`Consultar, referir o colaborar con otros profesionales cuando sea necesario para los mejores intereses de quienes se atiende.`]],
[`Integridad`,[`Promover precisión, honestidad y veracidad en la ciencia, la enseñanza y la práctica; no robar, engañar ni tergiversar hechos.`,`Cuando el engaño pueda ser éticamente justificado, existe la obligación seria de considerar su necesidad, sus consecuencias y de corregir la desconfianza resultante.`]],
[`Justicia`,[`La imparcialidad da derecho a todas las personas a acceder y beneficiarse de los aportes de la psicología, y a la misma calidad de servicio.`,`Ejercer juicio razonable y tomar precauciones para que los sesgos propios no conduzcan a prácticas injustas.`]],
[`Respeto por los derechos y la dignidad`,[`Respetar la dignidad, la privacidad, la confidencialidad y la autodeterminación de las personas.`,`Reconocer diferencias de edad, género, identidad de género, raza, etnia, cultura, religión, orientación sexual, discapacidad, idioma y nivel socioeconómico, e intentar eliminar el efecto de los sesgos basados en esos factores.`]]]},

{n:`Ley 1090: derechos, deberes y prohibiciones`,ic:`⚖️`,lead:`Ley 1090 de 2006: reglamenta el ejercicio de la Psicología en Colombia y dicta el Código Deontológico y Bioético.`,c:[
[`Derechos de los/las psicólogos(as)`,[`Respeto y reconocimiento.`,`Protección especial por parte del empleador.`,`Ejercer dentro del marco ético.`,`Proponer innovaciones al Sistema General de Seguridad Social en Salud.`,`Recurso humano, tecnología e insumos adecuados y necesarios.`]],
[`Deberes y obligaciones`,[`Guardar completa reserva de los motivos de consulta e identidad (persona, situación o institución).`,`Manejo adecuado de la información por parte del personal auxiliar.`,`Registro en las historias clínicas y demás acervos documentales; custodia de documentos confidenciales.`,`Registro escrito de prácticas y procedimientos; secreto profesional de prescripción o acto.`,`Cumplir las normas vigentes en la prestación de servicios y respetar los principios y valores de la norma ética.`]],
[`Prohibiciones`,[`Manejo indebido de honorarios.`,`Anunciar actividad profesional publicando falsos éxitos terapéuticos o datos inexactos.`,`Revelar secreto profesional.`,`Omitir o retardar el cumplimiento de las actividades profesionales.`,`Solicitar o aceptar prebendas o beneficios indebidos.`,`Realizar actividades que contravengan la buena práctica profesional.`]],
[`Cuestiones éticas centrales de la psicología`,[`Consentimiento informado, secreto profesional y confidencialidad: los tres ejes que desarrolla el resto de este corte.`]]]},

{n:`Secreto profesional`,ic:`🤐`,lead:`Derecho fundamental del usuario y deber del psicólogo: "el secreto profesional es inviolable" (Constitución, art. 74).`,c:[
[`Planteamiento básico`,[`"El profesional de la psicología está obligado a guardar el secreto profesional en todo aquello que por razones del ejercicio de su profesión haya recibido información" (Ley 1090, art. 23).`,`Cuando la evaluación se produce a petición del propio sujeto, la información solo puede comunicarse a terceros con su autorización previa y dentro de los límites de esa autorización.`]],
[`Derecho y deber`,[[`Derecho`,`Derecho fundamental (dignidad y libertad) del usuario y del psicólogo (Sentencia C-538 de 1997); nadie puede ser obligado a revelar información suministrada por el usuario.`],[`Deber`,`Del psicólogo(a): guardar la reserva de forma constante, salvo las salvedades previstas por la ley.`]]],
[`¿Existen salvedades? (Ley 1090, art. 25)`,[`Cuando la evaluación fue solicitada por autoridad competente, entes judiciales, profesores, padres, empleadores u otro solicitante distinto del sujeto evaluado.`,`Cuando las autoridades legales lo soliciten: solo la información estrictamente necesaria.`,`Cuando el cliente esté en incapacidad física o mental demostrada que le impida recibir resultados o dar su consentimiento.`,`Cuando se trata de niños pequeños que no pueden dar su consentimiento.`]],
[`Sin embargo...`,[`"El secreto profesional es inviolable" (Constitución, art. 74); la Corte Constitucional sostiene que ninguna ley puede imponer salvedades al secreto profesional (Sentencia C-411 de 1993).`,`Se concluye: al psicólogo no le es optativo revelar o no el secreto profesional; su deber ético, constitucional y legal es siempre mantener la reserva, salvo con el consentimiento informado del usuario o de sus representantes legales (Doctrina 02 de 2018 - COLPSIC).`]],
[`Cuando se convierte en dilema ético`,[`"Ningún derecho, aun siendo fundamental, es absoluto" (Sentencia T-1319 de 2001).`,`Ante situaciones complejas donde esté en peligro la integridad del usuario o de terceros, revelar o no el secreto deja de ser un problema de norma positiva y se convierte en un dilema ético (Doctrina 02 de 2018).`]],
[`Doctrina del mal menor`,[`"De duobus malis minus est semper eligendum" (Cicerón): entre dos males, elegir siempre el menor.`,`Requisitos: 1) agotar todas las estrategias para lograr el consentimiento del usuario; 2) usar estrategias/métodos de toma de decisiones; 3) recurrir a la doctrina del mal menor apoyándose en la realidad fáctica y social, en los principios éticos universales (Ley 1090, art. 13) y en que "no queda otro camino que el del mal menor".`,`Conclusión: podrá romper su silencio, causando el mal menor posible y evitando un daño mayor.`]],
[`Estado de necesidad y legítima defensa`,[`No habrá responsabilidad penal cuando se obre por necesidad de proteger un derecho propio o ajeno de un peligro actual o inminente, inevitable de otra manera (Ley 599 de 2000, art. 32).`,`La necesidad de hacer revelaciones para evitar la comisión de un delito se considera causal de exclusión de responsabilidad en el tipo disciplinario (Sentencia C-301 de 2012).`,`Queda a discreción del Tribunal Deontológico y Bioético de Psicología valorar los argumentos y decidir si hay o no sanción.`]],
[`Revelar vs. divulgar`,[[`Revelar`,`Comunicación natural entre individuos legítimamente vinculados a un mismo asunto, reservado para ellos (ej. asesoría con otro profesional); permanece dentro de la reserva profesional.`],[`Divulgar`,`Difundir ante el público una información sin seleccionar a los receptores, o ante personas que no tienen el deber de reserva.`]]],
[`Situaciones específicas de la praxis`,[`A petición de un tercero: hay que informar previa, tácita y expresamente al usuario que su información será conocida por terceros; el usuario debe dar su consentimiento y los terceros tienen la misma obligación de reserva.`,`El secreto también aplica al recoger información de grupos específicos: población vulnerable, personas desplazadas, excombatientes, comunidades cívicas, grupos escolares o religiosos.`,`En exposiciones didácticas o de divulgación científica de casos clínicos, debe evitarse la identificación de la persona, o solicitar su consentimiento previo y explícito (Ley 1090, art. 29).`]]]},

{n:`Confidencialidad e historia clínica`,ic:`🗂️`,lead:`Registro de las acciones profesionales: un documento privado, obligatorio y sometido a reserva.`,c:[
[`Confidencialidad: guardar e informar`,[`"Los psicólogos tienen una obligación básica respecto a la confidencialidad de la información obtenida de las personas... y deberán informar a sus usuarios de las limitaciones legales de la confidencialidad" (Ley 1090, art. 2, num. 5).`,`Se informa a: usuarios directos habilitados, usuarios declarados legalmente incapaces, representantes legales y organizaciones con relación científica o profesional.`]],
[`¿Cuándo se debe informar?`,[`Al comienzo de la relación profesional y de nuevo cuando lo exijan nuevas circunstancias: es permanente.`,`Si se ofrecen servicios por transmisión electrónica, informar sobre riesgos a la privacidad y límites de la confidencialidad.`,`Antes de grabar voces o imágenes de las personas a quienes se presta el servicio.`]],
[`Historia clínica: definición`,[`"Documento privado, obligatorio y sometido a reserva, en el cual se registran cronológicamente las condiciones de salud del paciente, los actos y procedimientos ejecutados... Solo puede ser conocido por terceros previa autorización del paciente o en los casos previstos por la ley" (Resolución 1995 de 1999).`,`"Registro escrito que pueda sistematizarse de las prácticas y procedimientos que implemente en ejercicio de su profesión" (Ley 1090, art. 10).`]],
[`Debe incluir`,[`Quién efectuó el registro, hora y fecha, motivo de consulta, plan de evaluación o tratamiento, estrategias y procedimientos empleados, logros/avances, motivos de cierre o remisión, e impresión diagnóstica.`,`El/la psicólogo(a) se abstendrá de consignar información que pueda usarse en contra del consultante; puede guardar información íntima sometida a secreto profesional en un documento reservado bajo su custodia.`]],
[`Características de la historia clínica`,[[`Integralidad, secuencialidad, racionalidad científica, disponibilidad y oportunidad`,`Registro claro, legible, sin tachones ni siglas; cauto y crítico frente a etiquetas de desvalorización; evitar rotulaciones y diagnósticos definitivos; mantener en sitio cerrado y con debida custodia; si es electrónico, garantizar mecanismos de seguridad.`]]],
[`Responsabilidad sobre el registro`,[`Facilitar la prestación de servicios de salud, cumplir requisitos institucionales, asegurar precisión de facturación y pagos, cumplir la ley y permitir la replicación de estudios científicos.`,`Garantizar la confidencialidad usando codificación u otras técnicas para restringir el acceso, y diseñar planes de tratamiento de datos para el retiro de cargos o funciones.`]],
[`Minimización de intrusiones en la privacidad`,[`Incluir en informes solo la información mínima relacionada con el propósito de la comunicación.`,`Discutir información confidencial solo para fines científicos o profesionales apropiados, y comunicarse solo con personas claramente interesadas o autorizadas.`]],
[`Tarifas y honorarios`,[`Acordar arreglos de compensación y facturación lo antes posible; los honorarios deben ser consistentes con la ley y no pueden tergiversarse.`,`No se pueden retener los registros necesarios para el tratamiento de emergencia de un paciente únicamente porque no se ha recibido el pago.`]]]},

{n:`Consentimiento informado`,ic:`✍️`,lead:`Derecho fundamental, consecuencia lógica del derecho a la información y a la autonomía (Doctrina 03 de 2018 - COLPSIC).`,c:[
[`Definición`,[`"Consiste en ser informado de manera clara, objetiva, idónea y oportuna de aquellos procedimientos que afecten en mayor o menor medida otros bienes jurídicos esenciales como la vida y la integridad personal" (Corte Constitucional, SU337 de 1999, T-1019 de 2006, C-182 de 2016).`,`"Los psicólogos mantendrán suficientemente informados a los usuarios tanto del propósito como de la naturaleza de las valoraciones, intervenciones o procedimientos de entrenamiento, y reconocerán su libertad de participación" (Ley 1090, art. 2).`]],
[`Cuestiones preliminares`,[`Descansa en el principio de autonomía y respeto a la dignidad: el respeto por la libre decisión del usuario de tomar o no un tratamiento, ser evaluado o participar en una investigación.`,`Se sostiene en los principios constitucionales de dignidad humana, libre desarrollo de la personalidad, libertad individual y pluralismo.`,`Solo lo puede otorgar el usuario directo o su(s) representante(s) legal(es).`]],
[`Tipos de consentimiento`,[[`Pleno o idóneo`,`Usuario mayor de 18 años, sin ningún tipo de limitación cognitiva.`],[`Asistido`,`Menores de 18 años, con sus representantes legales: niño (incapaz absoluto, menor de 7 años), impúber (7-14 años) y adolescente (14-18 años, incapaz relativo) puede disponer de su derecho de manera relativa, acompañado de sus padres (Sentencias T-1025 de 2002 y C-264 de 1996).`],[`Legal o sustitutivo`,`Personas declaradas legalmente incapaces, a través de sus representantes legales.`]]],
[`Recurso de COLPSIC`,[`El Colegio Colombiano de Psicólogos ofrece una lista de chequeo y modelos de formato de consentimiento informado (pleno, para adolescentes de 12 a 18 años y para menores de 12 años) en la Doctrina 03 de 2018.`]]]},

{n:`Deontología y tribunales`,ic:`🏛️`,lead:`Ley 1090, Capítulo XI: el proceso deontológico y bioético disciplinario para los profesionales de la Psicología.`,c:[
[`Tribunales Deontológicos y Bioéticos`,[`Instancia legal generada por la Ley 1090 de 2006 con el propósito de obrar como autoridad para conocer los procesos disciplinarios deontológicos y bioético-profesionales de la práctica de la Psicología en Colombia, y sancionar las faltas establecidas en la ley.`,`Más que sancionar, su objetivo es garantizar la prestación de los servicios profesionales con los más altos estándares y una profunda reflexión ética que fortalezca la profesión.`]],
[`Cobertura nacional`,[`Existe un Tribunal Nacional y seis tribunales regionales (Zona Norte, Nororiente, Noroccidente, Eje Cafetero, Suroccidente, y Centro y Suroriente) con los que se cubre el ejercicio profesional en todos los departamentos del país.`]]]},

{n:`Casos para el panel de expertos`,ic:`🎭`,lead:`Tres situaciones para argumentar desde una teoría ética: aplica, cuestiona y argumenta tu postura.`,c:[
[`Caso 1 · Daniel y la comunidad indígena`,[`Daniel, psicólogo de una organización internacional, atiende a escolares de una comunidad indígena. Intuye que algunas adolescentes fueron sometidas a ablación femenina por sus madres cuando eran niñas; la comunidad no tenía reportes de esta práctica y algunos líderes lo negaron. Daniel solicita a título personal la intervención de una institución nacional de defensa de la infancia.`,`Preguntas para el panel: ¿qué principio (beneficencia, respeto cultural, secreto profesional) debería primar? ¿Actuó dentro de la doctrina del mal menor o vulneró el respeto por las diferencias culturales?`]],
[`Caso 2 · Manuel, Alejandro y la historia clínica`,[`Alejandro, exalumno de un colegio, solicita años después copia de su historia clínica psicopedagógica al psicólogo Manuel. Al leerla, siente rabia por registros con detalles de su vida personal, juicios de valor y datos sobre su vida sexual. Manuel responde con indiferencia y sin explicación apropiada.`,`Preguntas para el panel: ¿qué características de la historia clínica (integralidad, evitar rotulaciones) se incumplieron? ¿Qué obligación de fidelidad y responsabilidad falló en la interacción con Alejandro?`]],
[`Caso 3 · Edith, Camilo y Daniela`,[`Edith atiende en terapia de pareja a Camilo y Daniela por pérdidas gestacionales. En sesión individual, Daniela le confiesa que nunca quiso tener hijos y que le detectaron una lesión maligna en cuello uterino, información que no ha compartido con Camilo. Edith plantea remitir a Camilo a otro profesional y sostener la intervención con Daniela.`,`Preguntas para el panel: ¿qué límites de la confidencialidad y el secreto profesional aplican dentro de una terapia de pareja? ¿La decisión de Edith respeta la autonomía de Daniela sin vulnerar la fidelidad hacia Camilo?`]],
[`Cómo prepararse`,[`Para cada caso: aplica los principios de tu teoría ética asignada, reconoce los dilemas y posibles conflictos entre valores, y argumenta tu postura con fundamentos claros y coherentes. No se trata de tener la "respuesta correcta", sino de argumentar mejor desde la teoría que representas.`]]]}
];

const X_BIO=[
[],
[[`Moral`,`Criterio que diferencia el bien del mal; conjunto de criterios con que una persona divide sus intenciones, creencias, decisiones y acciones entre buenas y malas.`,`Sentir que "está mal" mentirle a un amigo, sin necesitar una teoría para saberlo.`,`Moral = costumbre y base social.`],
[`Ética`,`Ciencia que estudia la moral con sistemas teóricos que explican la división entre conductas buenas y malas; de naturaleza individual y reflexiva, no puede exigirse de forma general.`,`Un filósofo que argumenta por qué mentir está mal usando una teoría (p. ej. el imperativo categórico).`,`Ética = teoría + reflexión individual.`],
[`Ley`,`Norma con poder coercitivo dentro de un sistema de derecho; su incumplimiento implica sanciones, aunque trate los mismos temas que la moral.`,`Que mentir en un contrato sea causal de nulidad civil, con independencia de si se considera "malo".`,`Ley = norma + sanción.`],
[`Libertad según Savater`,`No somos libres de elegir lo que nos pasa, sino libres de elegir cómo hacer frente a lo que nos pasa; nadie puede ser libre en mi lugar.`,`Ante una enfermedad no elegida, la persona sí elige cómo afrontarla.`,`Libre de elegir la respuesta, no el suceso.`],
[`Ley 599 de 2000 (Código Penal)`,`Fundamenta el derecho penal en el respeto a la dignidad humana y define las funciones de la pena: prevención, retribución justa, reinserción y protección.`,`Una condena que busca reinsertar socialmente al condenado, no solo castigarlo.`,`Pena: prevenir + retribuir + reinsertar.`]],
[[`Ética de la virtud`,`Fundamenta lo correcto en el carácter virtuoso (Aristóteles): actuar como lo haría una persona prudente, justa y templada, cultivado por hábito.`,`Un profesional que actúa con prudencia ante un dilema, no por seguir una regla sino por su carácter formado.`,`Virtud = carácter + hábito.`],
[`Utilitarismo`,`Fundamenta lo correcto en maximizar el bienestar y minimizar el daño para el mayor número de personas (Bentham).`,`Priorizar una política de salud pública que beneficie a la mayoría de la población, aunque implique costos para unos pocos.`,`Utilitarismo = mayor bienestar para más personas.`],
[`Ética Kantiana`,`Fundamenta lo correcto en el deber y en el imperativo categórico: actuar solo según máximas universalizables, sin importar las consecuencias.`,`No mentir nunca, incluso si mentir traería un resultado conveniente, porque mentir no puede ser ley universal.`,`Kant = deber + universalidad.`],
[`Ética del cuidado`,`Fundamenta lo correcto en las relaciones, la empatía y la interdependencia, valorando el vínculo y la vulnerabilidad por encima de reglas abstractas.`,`Una enfermera que decide según lo que mejor cuida la relación y las necesidades concretas del paciente.`,`Cuidado = relación + vulnerabilidad.`],
[`Ética discursiva (Habermas)`,`Fundamenta lo correcto en el consenso alcanzado mediante el diálogo racional entre todos los afectados, en condiciones de igualdad.`,`Una norma de convivencia acordada tras un debate abierto entre todos los vecinos de un edificio.`,`Habermas = diálogo + consenso.`]],
[[`Moral heterónoma (Piaget)`,`Pensamiento concreto y normas externas impuestas por una autoridad, típico de etapas tempranas del desarrollo moral.`,`Un niño que obedece una regla "porque lo dice mamá", sin entender su sentido.`,`Heterónoma = norma de afuera.`],
[`Moral autónoma (Piaget)`,`Relaciones de igualdad y convencionalidad de la norma, construida entre pares.`,`Un grupo de amigos que acuerda las reglas de un juego y las respeta porque las construyeron juntos.`,`Autónoma = norma construida entre pares.`],
[`Nivel pre-convencional (Kohlberg)`,`Orientación de castigo y obediencia, o instrumental y relativista; perspectiva egocéntrica o individualista concreta.`,`Un niño que no roba un dulce solo porque teme el castigo, no porque entienda que robar está mal.`,`Pre-convencional = evitar castigo / conseguir premio.`],
[`Nivel convencional (Kohlberg)`,`Orientación del "niño bueno" o de ley y orden; perspectiva interpersonal o social.`,`Cumplir una norma para ser visto como "buena persona" por el grupo, o por respeto al orden social.`,`Convencional = aprobación social + orden.`],
[`Nivel post-convencional (Kohlberg)`,`Orientación legalista del contrato social o a principios éticos universales; perspectiva anterior a la sociedad o que parte de acuerdos compartidos.`,`Desobedecer una ley injusta por defender un principio de justicia universal.`,`Post-convencional = principios universales.`],
[`Esquemas de Rest`,`Progresión desde intereses primarios y de mantenimiento (perspectiva sociocéntrica) hasta un esquema post-convencional de ideales y obligaciones recíprocas.`,`Un profesional que pasa de cumplir normas del grupo a defender ideales éticos compartidos con toda la sociedad.`,`Rest = intereses → mantenimiento → ideales compartidos.`]],
[[`Ética de la representación`,`Reflexión que cuestiona estereotipos y exclusiones en las imágenes y relatos, y promueve prácticas que cuidan la dignidad y la diversidad.`,`Cuestionar por qué ciertos cuerpos o formas de vida rara vez aparecen representados como "normales" en los medios.`,`Representación = quién se ve y quién no.`],
[`Estética y poder (Foucault)`,`Los cánones estéticos construyen lo aceptable, lo legítimo y lo humano; el poder produce realidad y dominio de objetos y rituales de verdad.`,`Un canon de belleza que determina qué cuerpos se consideran "saludables" o "correctos".`,`Poder = produce verdad y norma estética.`]],
[[`Principios Generales vs. Estándares Éticos`,`Los Principios Generales son aspiracionales, guían e inspiran; los Estándares Éticos representan obligaciones y pueden dar base a sanciones.`,`"Ser beneficente" es un ideal aspiracional; "no revelar el secreto profesional" es un estándar sancionable.`,`General = ideal · Estándar = obligación.`],
[`Beneficencia y no maleficencia`,`Esforzarse por beneficiar a quienes se trabaja y cuidar de no hacer daño, salvaguardando bienestar y derechos.`,`Suspender una técnica que, aunque efectiva, está generando malestar excesivo en el paciente.`,`Beneficencia = ayudar sin dañar.`],
[`Fidelidad y responsabilidad`,`Establecer relaciones de confianza, aclarar funciones y obligaciones, y asumir la responsabilidad apropiada por el propio comportamiento.`,`Remitir a otro colega cuando el caso excede la propia competencia.`,`Fidelidad = confianza + responsabilidad.`],
[`Integridad`,`Promover precisión, honestidad y veracidad; no robar, engañar ni tergiversar hechos, salvo justificación ética seria y con responsabilidad de corregir la desconfianza generada.`,`Reportar con exactitud los resultados de una evaluación, aunque no sean los esperados por el cliente.`,`Integridad = honestidad + veracidad.`],
[`Justicia`,`La imparcialidad da derecho a todas las personas a acceder y beneficiarse por igual de los servicios psicológicos.`,`Ofrecer la misma calidad de atención a todos los pacientes, sin importar su nivel socioeconómico.`,`Justicia = acceso y calidad iguales.`],
[`Respeto por los derechos y la dignidad`,`Respetar la dignidad, la privacidad, la confidencialidad y la autodeterminación, reconociendo diferencias culturales, de edad, género y otras.`,`Adaptar una evaluación considerando el idioma y el contexto cultural del usuario.`,`Respeto = dignidad + diferencia.`]],
[[`Derechos de los/las psicólogos(as)`,`Respeto y reconocimiento, protección especial del empleador, ejercer dentro del marco ético, proponer innovaciones al SGSS y contar con recursos adecuados.`,`Un psicólogo que exige a su empleador los insumos necesarios para una evaluación válida.`,`Derechos: respeto, protección, marco ético, recursos.`],
[`Deberes y obligaciones (Ley 1090)`,`Guardar reserva de motivos de consulta e identidad, registrar historias clínicas, custodiar documentos confidenciales y cumplir la normativa vigente.`,`Archivar bajo llave las historias clínicas de los pacientes atendidos.`,`Deberes: reserva, registro, custodia, cumplimiento.`],
[`Prohibiciones (Ley 1090)`,`Manejo indebido de honorarios, publicitar falsos éxitos terapéuticos, revelar el secreto profesional, o solicitar beneficios indebidos.`,`Anunciar en redes sociales una "tasa de curación del 100 %" sin sustento.`,`Prohibido: mentir, revelar, cobrar indebidamente.`]],
[[`Secreto profesional: derecho y deber`,`Derecho fundamental del usuario (dignidad y libertad) y deber del psicólogo; nadie puede ser obligado a revelar información suministrada por el usuario (Constitución, art. 74).`,`Un psicólogo se niega a entregar información de un paciente a un familiar sin su autorización.`,`Secreto = derecho del usuario + deber del psicólogo.`],
[`Salvedades del art. 25 (Ley 1090)`,`A petición de autoridad competente distinta del sujeto evaluado, a solicitud de autoridades legales (información estrictamente necesaria), incapacidad del cliente o niños pequeños sin capacidad de consentir.`,`Un juez solicita un informe psicológico dentro de un proceso judicial.`,`Salvedades: autoridad, incapacidad, niños.`],
[`Doctrina del mal menor`,`"De duobus malis minus est semper eligendum": entre dos males, elegir siempre el menor, agotando antes todas las estrategias para lograr el consentimiento.`,`Romper la reserva para evitar un daño mayor e inminente a un menor, tras agotar otras vías.`,`Mal menor = último recurso, no primera opción.`],
[`Estado de necesidad y legítima defensa`,`No hay responsabilidad penal cuando se obra por necesidad de proteger un derecho propio o ajeno de un peligro actual o inminente (Ley 599 de 2000, art. 32).`,`Revelar información para evitar la comisión inminente de un delito grave.`,`Necesidad = proteger un derecho de un peligro inminente.`],
[`Revelar vs. divulgar`,`Revelar es comunicación natural entre personas legítimamente vinculadas al asunto, dentro de la reserva profesional; divulgar es difundir sin seleccionar receptores.`,`Consultar un caso con un colega (revelar) frente a publicarlo en redes sociales (divulgar).`,`Revelar = dentro del círculo · Divulgar = al público.`]],

[`Historia clínica`,`Documento privado, obligatorio y sometido a reserva que registra cronológicamente las condiciones, actos y procedimientos de la atención; solo puede conocerse con autorización o por ley.`,`El registro fechado de cada sesión de terapia, con el motivo de consulta y el plan de tratamiento.`,`Historia clínica = documento privado y cronológico.`],
[`Qué debe incluir la historia clínica`,`Quién y cuándo efectuó el registro, motivo de consulta, plan de evaluación o tratamiento, estrategias empleadas, avances, motivo de cierre e impresión diagnóstica.`,`Un formato de historia clínica con todos esos campos diligenciados sesión a sesión.`,`Incluir: quién, cuándo, motivo, plan, avances, cierre.`],
[`Características de la historia clínica`,`Integralidad, secuencialidad, racionalidad científica, disponibilidad y oportunidad; evitar rotulaciones y diagnósticos definitivos.`,`Describir un patrón de conducta observado, en vez de escribir una etiqueta diagnóstica cerrada y definitiva.`,`Evitar etiquetas; mantener registro claro y custodiado.`]],
[[`Consentimiento informado`,`Derecho fundamental de ser informado de manera clara, objetiva, idónea y oportuna sobre procedimientos que afectan la vida o la integridad personal.`,`Explicar antes de una evaluación en qué consiste, para qué sirve y qué se hará con los resultados.`,`Consentimiento = información clara y previa.`],
[`Consentimiento pleno o idóneo`,`El que otorga un usuario mayor de 18 años sin ningún tipo de limitación cognitiva, en primera persona y sin intervención de terceros.`,`Un adulto que firma su propio consentimiento antes de iniciar terapia.`,`Pleno = mayor de edad, sin limitación cognitiva.`],
[`Consentimiento asistido`,`El de menores de 18 años junto a sus representantes legales; el adolescente (14-18 años, incapaz relativo) puede participar de forma acompañada.`,`Un adolescente de 15 años que firma junto a sus padres el consentimiento para una evaluación.`,`Asistido = menor + representante legal.`],
[`Consentimiento legal o sustitutivo`,`El que otorgan los representantes legales de personas declaradas legalmente incapaces.`,`El tutor legal de una persona declarada interdicta firma en su representación.`,`Sustitutivo = representante legal por incapacidad.`]],
[[`Tribunales Deontológicos y Bioéticos`,`Instancia legal creada por la Ley 1090 de 2006 para conocer procesos disciplinarios y sancionar faltas, buscando ante todo elevar los estándares de la profesión.`,`Un tribunal regional que evalúa una queja disciplinaria contra un psicólogo por incumplir el secreto profesional.`,`Tribunales = conocer faltas + elevar estándares.`],
[`Cobertura territorial`,`Un Tribunal Nacional y seis tribunales departamentales regionales cubren el ejercicio profesional en todo el país.`,`Un psicólogo de la Costa Caribe acude al tribunal de su zona regional correspondiente.`,`1 nacional + 6 regionales.`]],
[[`Caso Daniel: ablación femenina`,`Situación en la que un psicólogo, ante indicios de una práctica dañina hacia menores en una comunidad indígena, solicita la intervención de una institución de defensa de la infancia.`,`Ponderar el respeto por la diversidad cultural frente al deber de proteger a niñas en riesgo.`,`Daniel: cultura vs. protección de menores.`],
[`Caso Alejandro: historia clínica`,`Situación en la que un exalumno reclama, años después, el manejo inadecuado y poco cuidadoso de su historia clínica psicopedagógica.`,`Evaluar si el registro incluyó juicios de valor y datos sensibles que no debían consignarse así.`,`Alejandro: historia clínica mal registrada.`],
[`Caso Edith: terapia de pareja`,`Situación en la que la psicóloga debe decidir cómo manejar información confidencial revelada por uno de los miembros de una pareja en terapia conjunta.`,`Decidir si remitir a uno de los miembros a otro profesional protege mejor la confidencialidad y la relación terapéutica.`,`Edith: confidencialidad dentro de terapia de pareja.`]]
