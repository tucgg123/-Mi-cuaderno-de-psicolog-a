</style></head><body><div id="tb"><button id="mn" title="Menú">☰</button><b id="ct">🧠 Memoria</b><span class="sp"></span><button id="th2" title="Modo oscuro / claro"></button></div><div id="ov"></div><div id="dw"><div class="dh">📚 Mis materias</div><button class="tab on">🧠 Memoria</button><button class="tab">👶 Infancia</button><button class="tab">🔬 Evaluación cualitativa</button><button class="tab">⚖️ Ética</button></div><div id="pm"><header><b>🧠 Memoria</b><input id="s" placeholder="Buscar: bucle fonológico, Tulving…"><button id="th" title="Modo oscuro / claro"></button></header><nav id="nv"></nav><div id="sr"></div><main id="app"></main></div><div id="pi" hidden><nav id="nv2"></nav><main id="in"></main></div><div id="pc" hidden><nav id="nvc"></nav><main id="inc"></main></div><div id="pn" hidden><main id="ann"></main></div><div id="tm"><div class="tm-body"><div class="tm-info"><span class="tm-lbl">Sesión de estudio</span><span id="tt"></span></div><button id="tp" data-a="tp" title="Pausar / reanudar"></button></div><div class="tm-bar"><i class="tm-bar-i"></i></div></div><div id="lk"></div><script>
const M=[{n:'Modelo Multialmacén',au:'Atkinson y Shiffrin',yr:'1968',ic:'01',k:'Memoria sensorial, MCP, MLP, repaso, 7 ± 2',
idea:'La memoria se compone de tres almacenes: sensorial, corto plazo (MCP) y largo plazo (MLP).',dif:'Tres almacenes con transferencia lineal de la información.',
what:'Es uno de los modelos más influyentes de la psicología cognitiva para explicar cómo se procesa la información en la memoria. Sugiere que la memoria humana se compone de tres almacenes o sistemas principales: la memoria sensorial, la memoria a corto plazo (MCP) y la memoria a largo plazo (MLP).',
nodes:[{t:'Memoria sensorial',d:[['Función','Primer almacén: retiene información sensorial (imágenes, sonidos, olores, etc.) por un tiempo muy breve (generalmente menos de un segundo).'],['Duración','Extremadamente corta, apenas unos milisegundos.'],['Capacidad','Muy grande: puede almacenar todo lo que perciben los sentidos.'],['Propósito','Permitir que la información se procese para que una parte pase a la MCP.'],['Ejemplo','(Estudio de caso) La palabra “apple” entra por la vista y el oído; si no se presta atención, se pierde.']]},
{t:'Memoria a corto plazo (MCP)',d:[['Función','Almacena la información atendida en la memoria sensorial. Aquí se realiza la manipulación consciente de la información.'],['Duración','Breve: aproximadamente entre 15 y 30 segundos.'],['Capacidad','Limitada: entre 5 y 9 elementos (“número mágico” de Miller: 7 ± 2).'],['Repaso','Se mantiene mediante repetición o repaso; con suficiente repaso puede transferirse a la MLP.'],['Decaimiento','Si no se repasa ni se asocia con otros conocimientos, se pierde.'],['Ejemplo','(Estudio de caso) Repetir la palabra en voz alta y usarla la mantiene en la MCP (unos 20 s sin repaso).']]},
{t:'Memoria a largo plazo (MLP)',d:[['Función','Almacena información de manera más permanente, con capacidad mucho mayor que la MCP.'],['Duración','Potencialmente indefinida: de minutos a toda la vida.'],['Capacidad','Prácticamente ilimitada.'],['Organización','Se almacena de manera organizada, a menudo en redes asociativas.'],['Recuperación','Puede verse influida por el olvido o la interferencia.'],['Ejemplo','(Estudio de caso) En la evaluación, los estudiantes recuperan la palabra desde la MLP.']]}],
how:'La MCP actúa como puerta de entrada por la cual la información accede a la MLP. Mediante la estrategia de ensayo y codificación, la información se agrupa y va formando la MLP.\nFlujo: sensorial → (atención) → MCP → (repaso y codificación) → MLP.\nNota de estudio: la redacción de la diapositiva 7 está incompleta; se conserva su sentido general.',
ex:'Estudio de caso: aprendizaje de vocabulario en un idioma extranjero. Una profesora presenta “apple” con imagen, sonido y escritura; los alumnos la repiten, la escriben, forman oraciones, la practican durante la semana (juegos, conversaciones, tareas) y la usan en una evaluación.\n1) Entra por los sentidos y se mantiene brevemente en la memoria sensorial; sin atención, se pierde.\n2) La repetición y el uso activo la mantienen en la MCP, limitada en capacidad y duración.\n3) La práctica distribuida y el uso significativo facilitan su codificación en la MLP; en la evaluación se recupera desde la MLP.',
app:'Diseño de actividades de aprendizaje de vocabulario (estudio de caso).',lim:'Es demasiado simplista: sugiere una transferencia lineal de la información sin considerar la complejidad de las interacciones entre los tipos de memoria.\nInvestigaciones posteriores dieron lugar a modelos más complejos, como el de Memoria de Trabajo de Baddeley y Hitch, con un enfoque más dinámico de la MCP.',
mem:['Atkinson y Shiffrin (1968) → Multialmacén','Sensorial: milisegundos, capacidad muy grande','MCP: 15–30 s, 7 ± 2, repaso; sin repaso se pierde','MLP: duración indefinida, capacidad ilimitada, redes asociativas','Crítica: simplista, transferencia lineal']},
{n:'Memoria de Trabajo',au:'Baddeley y Hitch',yr:'1974',ic:'02',k:'Ejecutivo central, bucle fonológico, agenda visoespacial, buffer episódico',
idea:'La MCP es un sistema activo de procesamiento con varios componentes interrelacionados.',dif:'La MCP es un sistema activo con varios componentes (amplía el multialmacén).',
what:'Amplía la comprensión de la MCP con un enfoque más dinámico y funcional. La MCP no es un simple almacén pasivo, sino un sistema activo de procesamiento que permite realizar tareas cognitivas complejas. Está compuesto por varios componentes interrelacionados, cada uno con funciones específicas.',
nodes:[{t:'Ejecutivo central',l:[1,2,3],d:[['Función','Controlador general del sistema. Coordina y supervisa la información entre los subsistemas (bucle fonológico y agenda visoespacial), dirige la atención y selecciona estrategias de procesamiento.'],['Capacidad limitada','Tiene recursos limitados: no puede manejar demasiadas tareas a la vez.'],['Ejemplo','Recordar una dirección mientras mantienes una conversación: distribuye tu atención entre las tareas.']]},
{t:'Bucle fonológico',l:[0],d:[['Función','Almacena y manipula temporalmente información verbal y auditiva.'],['Almacén fonológico','Retiene información auditiva (lista de palabras o números) durante unos segundos.'],['Repetición subvocal','Mantiene la información en el almacén mediante repetición interna (similar al repaso en la MCP).'],['Ejemplo','Repetir mentalmente un número de teléfono para no olvidarlo.']]},
{t:'Agenda visoespacial',l:[0],d:[['Función','Almacena y manipula información visual y espacial.'],['Propósito','Crear y manipular imágenes mentales: recordar la ubicación de objetos en una habitación o planificar un recorrido mental.'],['Ejemplo','Imaginar cómo reorganizar los muebles en una sala.']]},
{t:'Buffer episódico (añadido en 2000)',l:[0],d:[['Función','Almacena información integrada de diferentes modalidades (visual, verbal, etc.) y la organiza en secuencias o episodios coherentes.'],['Propósito','Almacenamiento temporal que une información de diferentes fuentes, como palabras e imágenes en una historia coherente.'],['Ejemplo','Recordar una historia leída o una experiencia personal que combina detalles visuales, auditivos y emocionales.']]}],
how:'Características clave:\n• Procesamiento activo: no solo retiene la información; la manipula para razonar, comprender y aprender.\n• Multitarea: permite realizar varias tareas a la vez usando subsistemas que procesan distintos tipos de información (visual, verbal, etc.).\n• Recursos limitados: la capacidad para manejar múltiples tareas simultáneamente es restringida.',
ex:'Sofía intenta recordar el número de teléfono de su amigo: repite mentalmente los números mientras los marca (bucle fonológico).\nLectura: el bucle fonológico retiene temporalmente las palabras leídas, mientras el ejecutivo central coordina la comprensión del significado general.\nMatemáticas mentales: la agenda visoespacial ayuda a visualizar números o figuras, mientras el bucle fonológico retiene los números que manipulas.',
app:'¿Cómo favorece la memoria de trabajo al aprendizaje? En la lectura y en las matemáticas mentales (ver ejemplos).',lim:'La presentación no plantea críticas a este modelo; solo señala que sus recursos son limitados.',
mem:['Baddeley y Hitch (1974) → Memoria de trabajo','Ejecutivo central en el centro; recursos limitados','Bucle fonológico: verbal/auditivo (almacén + repetición subvocal)','Agenda visoespacial: imágenes y espacio','Buffer episódico (2000): integra modalidades en episodios']},
{n:'Niveles de Procesamiento',au:'Craik y Lockhart',yr:'1972',ic:'03',k:'Profundidad, atención, procesamiento incidental/intencional, continuo',
idea:'El recuerdo depende de la profundidad con que se procesa la información, no de almacenes.',dif:'Sin almacenes separados: importa la profundidad del procesamiento.',
what:'Propuesta en 1972 como alternativa a los modelos tradicionales, como el Multialmacén. En lugar de centrarse en tipos de almacenes, sostiene que la memoria depende de la profundidad con que se procesa la información: la calidad del procesamiento, no la cantidad o la duración.',
nodes:[{t:'Superficial',d:[['Definición','La información se procesa solo en términos de sus aspectos físicos y sensoriales.'],['Ejemplo','Prestar atención solo a las formas de las letras de la palabra “perro”.'],['Objetivo','Activar el procesamiento perceptivo sin conexión profunda al significado.']]},
{t:'Intermedio',d:[['Definición','Las formas se traducen en unidades significativas (letras del alfabeto); busca conexiones o patrones significativos.'],['Características','Las letras se consideran en el contexto de palabras y se les atribuyen sonidos fonéticos.'],['Objetivo','Activar el procesamiento fonológico y semántico parcial.']]},
{t:'Profundo',d:[['Definición','Ocurre cuando la información se procesa de forma significativa o semántica: consideramos el significado o la relacionamos con otros conocimientos.'],['Características','Genera memorias más duraderas.'],['Ejemplo','Recordar una palabra pensando en su significado o usándola en una oración.'],['Objetivo','Activar el procesamiento semántico profundo y emocional.']]}],
how:'Comparación: Superficial ← Intermedio ← Profundo. Cuanto más profundo, más duradera la memoria.\n• Atención: cumple un rol crucial; sin ella ocurre muy poco procesamiento y casi de inmediato olvidamos el material nuevo.\n• Continuo de procesamiento: no hay límites rígidos entre “niveles” (como MCP y MLP), sino un continuo de profundidad; cuanto más profundamente se procesa, más probable es recordar.\n• Procesamiento incidental vs intencional: el profundo puede ocurrir sin intención de memorizar (incidental), a diferencia del intencional, cuyo objetivo es recordar activamente. La profundidad importa más para la retención que la intención de aprender.\n• Elimina el concepto de almacenes separados (MCP y MLP): la memoria depende del grado de procesamiento. Nota de estudio: la diapositiva 32 dice “nos postula”; por el contexto, el sentido es que NO postula almacenes separados.',
ex:'Actividad de las listas (cada una con una tarea distinta):\nLista A: contar cuántas palabras tienen más de 5 letras.\nLista B: decir si cada palabra rima con “acción”.\nLista C: relacionar cada palabra con una experiencia personal o emocional.\nPreguntas: ¿con qué lista recordaron más palabras? ¿qué tipo de procesamiento es más útil para estudiar? ¿cómo aplicarlo en su vida académica?\nNota de estudio: la presentación no etiqueta las listas por nivel; por sus tareas corresponden a superficial (A), intermedio (B) y profundo (C).',
app:'Educación: el aprendizaje efectivo ocurre cuando se procesa a nivel profundo (comprensión, síntesis, aplicación) y no solo memorizando datos.\nMemoria y retención: resumir con tus propias palabras o relacionar con experiencias previas suele ser más eficaz que releer o repetir.',lim:'La presentación no plantea críticas a esta teoría.',
mem:['Craik y Lockhart (1972) → Niveles de procesamiento','Superficial → intermedio → profundo','Más profundo = memoria más duradera','Sin almacenes separados; continuo de profundidad','Profundidad > intención de aprender']},
{n:'Redes Semánticas',au:'Collins y Quillian',yr:'Década de 1960',yrn:'La referencia de la presentación es de 1969.',ic:'04',k:'Nodos, enlaces, jerarquía, propagación de la activación',
idea:'El conocimiento se organiza en una red jerárquica de nodos (conceptos) unidos por enlaces (relaciones).',dif:'Conocimiento organizado como red de nodos y enlaces, con propagación de la activación.',
what:'Propuesto inicialmente en la década de 1960 para representar cómo se organizan los conceptos y el conocimiento en la mente. La información semántica se organiza en una red de nodos interconectados: cada nodo es un concepto y las conexiones (enlaces) son relaciones semánticas.',
nodes:[{t:'Animal',l:[1,3],d:[['Jerarquía','Concepto general: está en un nivel superior a “pájaro”.']]},{t:'Pájaro',l:[0,2],d:[['Nodo','Ejemplo de nodo (concepto).'],['Enlace','Conectado a “volar” porque volar es una característica típica de los pájaros.'],['Jerarquía','Nivel inferior a “animal”.']]},{t:'Volar',l:[1],d:[['Nodo','Característica típica de los pájaros, enlazada al nodo “pájaro”.']]},
{t:'Mamífero',l:[0,4,5,6],d:[['Ejemplo educativo','Estudiante que ya conoce “animal” y “pájaro” agrega “mamífero” como nodo nuevo conectado a “animal”.']]},{t:'León',l:[3],d:[['Ejemplo educativo','Con el tiempo se relaciona con “mamífero”.']]},{t:'Humano',l:[3],d:[['Ejemplo educativo','Con el tiempo se relaciona con “mamífero”.']]},{t:'Ballena',l:[3],d:[['Ejemplo educativo','Con el tiempo se relaciona con “mamífero”.']]}],
how:'• Nodos: cada uno representa un concepto o palabra (“pájaro”, “animal”, “volar”).\n• Enlaces: relaciones entre conceptos (“pájaro” con “volar”).\n• Jerarquía: los conceptos generales están en niveles superiores y los específicos en inferiores (“animal” sobre “pájaro”).\n• Propagación de la activación: al pensar en un concepto se activa su nodo y la activación se extiende a nodos cercanos. Explica cómo recuperamos información relacionada y cómo el contexto influye en la interpretación de las palabras.\nToca un nodo para ver cómo se propaga.',
ex:'Un estudiante que aprende sobre mamíferos y ya conoce “animal” y “pájaro” agrega “mamífero” como nodo nuevo conectado a “animal”; con el tiempo lo relaciona con “león”, “humano” y “ballena”, formando una red más compleja.\nActividad de clase: en grupos, construir un mapa de red con un concepto central (“memoria”) y conceptos como “memoria episódica”, “memoria semántica”, “atención”, “recuperación”; explicar cómo se activan los nodos ante un estímulo (la palabra “examen”). Reflexión: ¿cómo influye la organización del conocimiento en la recuperación? ¿Qué pasa si los nodos están mal conectados?',
app:'Psicolingüística: cómo se comprende y produce el lenguaje.\nMemoria: cómo se almacenan y recuperan los conocimientos.\nEducación: cómo los estudiantes organizan y conectan la información nueva con la ya existente.',lim:'Nota de estudio: la diapositiva 42 tiene el título “Limitaciones del Modelo” pero sin contenido. Solo aparece la conclusión: el modelo es una herramienta poderosa para entender cómo la mente organiza y procesa la información semántica, y permite visualizar cómo los conceptos están interconectados.',
mem:['Collins y Quillian → Redes semánticas','Nodos = conceptos; enlaces = relaciones','Jerarquía: general arriba, específico abajo','Propagación de la activación a nodos cercanos']},
{n:'Modelo de Tulving',au:'Endel Tulving',yr:'1972',yrn:'Otros hitos: 1970, 1982 y 1985.',ic:'05',k:'Declarativa (episódica, semántica), no declarativa, autobiográfica, prospectiva',
idea:'La memoria a largo plazo no es unitaria: se distingue memoria declarativa y no declarativa.',dif:'Distingue memoria declarativa (consciente) y no declarativa (inconsciente).',
what:'La teoría de Tulving (1972) generó un intenso debate al refutar la idea predominante de que la MLP era unitaria. La distinción entre memoria episódica y semántica ha influido en la cognición, la neuropsicología, la neurociencia cognitiva y la investigación clínica.\nMemoria declarativa: capacidad de evocación consciente de información y experiencias.\nMemoria no declarativa: cambios inconscientes en la ejecución de tareas atribuibles a la exposición previa a esa información.\nObjetivo: comprender sus componentes (episódica, semántica y procedimental) en relación con la experiencia personal y el contexto educativo.',
nodes:[{t:'Memoria declarativa',l:[1,2],d:[['Definición','Capacidad para la evocación consciente de información y experiencias.'],['Incluye','Memoria episódica y memoria semántica.']]},
{t:'Episódica',l:[0,3],d:[['Definición','Capacidad de desplazarnos mentalmente hacia atrás en el tiempo y recuperar sucesos del pasado vividos personalmente, en un tiempo y espacio concretos.'],['Idea clave','¿Qué? ¿Cuándo? ¿Dónde?'],['Ejemplo','¿Qué, cuándo y dónde desayunaron ayer?']]},
{t:'Semántica',l:[0,3],d:[['Definición','Conocimiento general del mundo sin relación con el contexto espacio-temporal (nombres, conceptos, datos).'],['Ejemplo','Identificar el símbolo del café, o saber de dónde vino o fue cultivado el café.'],['Nota','Episódica y semántica interactúan entre sí y con la memoria de trabajo, pero tienen bases anatomofuncionales diferenciadas.']]},
{t:'Memoria autobiográfica',l:[1,2],d:[['Ejemplo','“Recuerdo el enfado de mi madre cuando corté una sábana que estaba bordando” y “mi madre era modista y en casa teníamos una máquina de coser”.'],['Procesos implicados','Atención, percepción, emoción, memoria de trabajo, episódica y semántica.'],['Cerebro','La neuroimagen funcional muestra una red de regiones (predominio izquierdo): prefrontal medial y ventrolateral, córtex temporal medial y lateral, conjunción temporoparietal, cingulado posterior/retroesplenial y cerebelo (Svoboda, 2006).']]},
{t:'Memoria prospectiva',d:[['Definición','Capacidad de recordar acciones que se deben realizar en el futuro; habilidad compleja de uso diario.'],['Ejemplos','Tomar la medicación a la hora indicada; acudir a una cita médica; comprar un producto en el supermercado; felicitar a alguien por su cumpleaños; recoger a un niño del colegio; asistir a una reunión de vecinos.'],['Deterioro','Se encuentra deteriorada en trastornos del espectro autista, ictus, daño cerebral traumático, consumo de riesgo de alcohol, esquizofrenia y fases de demencia. Las dificultades pueden aparecer en la codificación, el intervalo de retención y el mantenimiento.']]},
{t:'Memoria no declarativa (implícita)',l:[6,7,8],d:[['Definición','Cambios inconscientes en la ejecución de tareas atribuibles a la exposición previa a la estimulación.'],['Ejemplos','La velocidad al escribir mensajes en el móvil; elegir ciertas marcas tras ver repetidamente un anuncio.']]},
{t:'Condicionamiento clásico',l:[5],d:[['Idea','Uno de los cambios que incluye la memoria no declarativa.']]},{t:'Aprendizaje de habilidades (memoria procedimental)',l:[5],d:[['Idea','Incluida en la memoria no declarativa; ejemplo: velocidad al escribir en el móvil.']]},{t:'Priming (facilitación o preparación)',l:[5],d:[['Idea','Fenómeno incluido en la memoria no declarativa; ejemplo: elegir marcas tras ver repetidamente un anuncio.']]}],
how:'Cronología: 1970 investigaciones neuropsicológicas (con Daniel Schacter) en pacientes con lesiones cerebrales sobre memoria explícita (consciente) e implícita (inconsciente). 1982: descubre la memoria de reconocimiento y otros tipos de memorias explícitas. 1985: asocia las formas de memoria con tipos de conciencia: procedimental (aprendizaje de habilidades), semántica (saber) y episódica (autoconocimiento / “viaje mental en el tiempo”).\nPregunta de la presentación: ¿qué tipos de memoria conoces y cómo los usas en tu vida diaria?',
ex:'Ver los ejemplos en cada concepto (toca los nodos).',app:'Relacionar los componentes con la experiencia personal y el contexto educativo (objetivo de la presentación).',lim:'La presentación no plantea críticas a este modelo.',
mem:['Tulving → Tipos de memoria','Declarativa: episódica (qué, cuándo, dónde) y semántica (conocimiento del mundo)','No declarativa/implícita: condicionamiento clásico, habilidades (procedimental), priming','Autobiográfica: episódica + semántica; Prospectiva: acciones futuras']}];

[0,0,'¿Cuáles son los tres almacenes del modelo?',['Sensorial, MCP y MLP','Fonológico, visoespacial y episódico','Superficial, intermedio y profundo','Episódico, semántico y procedimental'],0,'Memoria sensorial, corto plazo y largo plazo.'],
[0,1,'¿Qué almacén dura milisegundos y tiene capacidad muy grande?',['MCP','MLP','Sensorial','Buffer episódico'],2,'Es la memoria sensorial.'],

[0,2,'Los alumnos repiten “apple” en voz alta y la escriben. ¿Qué mantiene la palabra en la MCP?',['Repetición o repaso','Priming','Memoria prospectiva','Procesamiento incidental'],0,'La repetición y el uso activo la mantienen en la MCP.'],
[0,2,'¿Qué crítica se hace al modelo multialmacén?',['Es demasiado simplista: supone transferencia lineal','Elimina los almacenes','Ignora la memoria sensorial','Solo explica la memoria episódica'],0,'No considera la complejidad de las interacciones entre memorias.'],
[1,0,'¿Quién propuso la memoria de trabajo y en qué año?',['Atkinson y Shiffrin, 1968','Baddeley y Hitch, 1974','Collins y Quillian, 1969','Craik y Lockhart, 1972'],1,'Baddeley y Hitch, 1974.'],
[1,0,'Un estudiante repite mentalmente un número de teléfono mientras busca dónde escribirlo. ¿Qué componente usa?',['Agenda visoespacial','Bucle fonológico','Buffer episódico','Memoria semántica'],1,'La repetición subvocal es del bucle fonológico.'],

[`Transición histórica de los marcos éticos`,[[`Origen biomédico`,`La regulación ética formal surge tras la Segunda Guerra Mundial (Código de Núremberg, Declaración de Helsinki, Informe Belmont) para proteger de la experimentación no ética y el daño corporal.`],[`El problema del traslado`,`Aplicar un código positivista y rígido a las ciencias sociales crea una “ética vacía”, reducida a un trámite burocrático como la mera firma de un papel (Abad Miguélez, 2016).`],`En lo social los riesgos son intangibles, sutiles e impredecibles: se requiere flexibilidad y sensibilidad.`]],
[`Ética vacía`,[`Enfoque convencional.`,`Reducida a trámites legales y de cumplimiento administrativo previos al estudio.`,`Considera la ética como un fin burocrático y estático.`]],
[`Ética situada`,[`Micro-ética / enfoque cualitativo.`,`Compromiso vivo, dinámico y relacional.`,`La responsabilidad se negocia y reafirma en el campo mediante la reflexividad del investigador y un diálogo intersubjetivo ininterrumpido con los participantes.`]]],
x:[`<b>Clave:</b> pasar de la “ética vacía” (trámite previo) a la “ética situada” (compromiso continuo en el campo).`]},

{n:`Rigor y pilares éticos`,ic:`🛡️`,lead:`Sinergia entre rigor metodológico y responsabilidad ética.`,c:[
[`Criterios de rigor (seis)`,[[`Credibilidad · valor de verdad`,`Los participantes reconocen los hallazgos como reales, mediante observación prolongada y triangulación.`],[`Transferibilidad · aplicabilidad`,`Trasladar resultados a otros contextos con descripciones detalladas y muestreo teórico riguroso.`],[`Consistencia · auditabilidad`,`Registro exhaustivo de la “trastienda” para que otros sigan el mapa de decisiones.`],[`Confirmabilidad · reflexividad`,`Reconocer el papel y las limitaciones del investigador, sin imponer sus juicios.`],[`Relevancia · aporte`,`Si se logró mejor conocimiento del fenómeno y hubo correspondencia entre justificación y resultados.`],[`Adecuación teórico-epistemológica · concordancia`,`Coherencia entre problema y teoría; la pregunta define el diseño y el tipo de conocimiento.`]]],
[`Pilares éticos en la recogida de información`,[[`Consentimiento dinámico`,`No es un papel previo: es una conversación y negociación continua con el participante.`],[`Confidencialidad`,`Protección rigurosa de los datos y permiso explícito para su uso y difusión.`],[`Anonimato`,`Uso de pseudónimos; cuidar que las citas textuales no revelen la identidad en comunidades pequeñas.`],[`Manejo de riesgos`,`Daño socioemocional: evitar falsas expectativas terapéuticas y limitar la intromisión indeseada.`]]],
[`Ética en la interacción directa`,[[`Entrevistas · cuidado de la catarsis`,`Entorno de absoluta confianza, sin interrupciones abruptas ni juicios; manejar silencio y empatía sin manipular la información.`],[`Observación participante`,`Balancear cercanía empática con respeto absoluto a la privacidad, aplicando justicia y beneficencia.`],[`Audio y video · notificación y resguardo`,`Autorización previa y explícita; custodia en archivos protegidos y destrucción segura tras un tiempo prudencial.`]]],
[`Consideraciones finales`,[`Los criterios de calidad no se analizan por separado: un criterio puede incidir en todos los demás.`,`La reflexividad es clave para que lo cualitativo sea reconocido como pilar científico.`,`Investigar con rigor mezcla reglas científicas con sensibilidad e imaginación artística.`]]],
x:[`<b>Fuente:</b> Noreña, Alcaraz-Moreno, Rojas y Rebolledo-Malpica (2012). Aplicabilidad de los criterios de rigor y éticos en la investigación cualitativa. <i>Aquichán, 12</i>(3), 263-274.`]},

{n:`Observación`,ic:`👁️`,lead:`Técnica fundamental: mirar con atención sistemática la realidad social para comprenderla en su contexto.`,c:[
[`Técnicas cualitativas`,[`Procedimientos concretos de recolección ligados al método inductivo. Sirven para recolectar, analizar, generar y presentar información.`,`Muestreo, recolección y análisis son casi paralelos; el proceso no es lineal sino dinámico.`,`Es deseable recolectar en ambientes naturales y cotidianos.`]],
[`Instrumentos cualitativos`,[[`Descripciones detalladas de eventos y conductas`,`Observación, diarios de campo.`],[`Narraciones de personas`,`Entrevista, grupo focal, historia de vida.`],[`Extractos o pasajes de documentos`,`Fuentes secundarias.`]]],
[`¿Qué se observa?`,[`Situación social a observar, de forma gradual para reconstruir su dinámica.`,[`Contexto físico`,`El espacio y ambiente donde ocurre la acción.`],[`Contexto social`,`Normas, relaciones y significados compartidos.`],[`Interacción entre actores`,`Cómo se relacionan y comunican los participantes.`]]],
[`Rol del “portero” (gatekeeper)`,[`Persona clave o líder con autoridad formal o moral para autorizar el ingreso del investigador.`,`No solo permite o restringe el acceso: legitima su presencia y facilita la aceptación del grupo.`]],
[`Rapport`,[`Relación de confianza, empatía, respeto y aceptación mutua con la comunidad.`,`Es esencial antes de la observación intensiva: sin rapport los participantes se ponen a la defensiva, ocultan información o muestran conductas poco auténticas.`]],
[`Reactividad`,[`Alteración del comportamiento natural al saberse observados (relacionado con el efecto Hawthorne).`,[`Recomendación`,`Ser consciente de la reactividad inicial y dar tiempo a que la comunidad se habitúe hasta que las interacciones vuelvan a su dinámica natural.`]]]],
x:[`El propósito no es medir variables para inferencia estadística, sino obtener datos en profundidad de personas, comunidades, contextos o situaciones, en sus propias formas de expresión.`]},

{n:`Tipos y pasos`,ic:`🧭`,lead:`Tipos de observación, progresión metodológica y pasos.`,c:[
[`Observación no participante`,[`Observador neutral y externo (perspectiva etic): registra sin intervenir ni formar parte de la dinámica.`,[`Estructuración progresiva`,`Permite sistematizar la recolección a medida que los focos se afinan.`],[`Guía de observación`,`Marco orientador o lista de cotejo cualitativa que enfoca la atención (ambientes, actores, secuencias, artefactos) sin rigidez que ciegue el hallazgo emergente.`]]],
[`Auto-observación`,[[`Reflexividad del investigador`,`El investigador se observa a sí mismo dentro del proceso.`],[`Auto-registro de participantes`,`Los participantes registran sus propias conductas o vivencias cotidianas.`],[`Examen del sesgo propio`,`Cómo emociones, prejuicios o postura del observador afectan la co-construcción de los datos.`]]],
[`Observación participante`,[`El investigador–observador participa activamente e interviene directamente con el grupo estudiado.`,`Permanece un tiempo suficiente para conocer comportamientos, interacciones y cotidianidades.`]],
[`Progresión · Descriptiva (inicio)`,[[`Mirada`,`Panorámica, “gran angular”.`],[`Pregunta`,`¿Qué está pasando aquí en general?`],[`Objetivo`,`Familiarizarse con el contexto registrando entorno, actores y actividades sin categorías rígidas.`],[`Utilidad`,`Evita la “visión de túnel”, mapea el espacio, identifica gatekeepers e informantes y produce las primeras notas.`]]],
[`Progresión · Enfocada (intermedio)`,[[`Mirada`,`Temática, dirigida.`],[`Pregunta`,`¿Cómo funciona esta categoría o proceso específico?`],[`Objetivo`,`Profundizar en dimensiones que emergieron como relevantes.`],[`Utilidad`,`Operacionaliza la guía o matriz de observación, según los objetivos del estudio.`]]],
[`Progresión · Selectiva (cierre)`,[[`Mirada`,`Micro, detallada.`],[`Pregunta`,`¿Qué matices confirman o refinan mi teoría?`],[`Objetivo`,`Evidencias finas y variaciones que validen o consoliden las categorías.`],[`Utilidad`,`Construye la “descripción densa” (Geertz) y permite la saturación teórica.`]]],
[`Pasos de la observación`,[[`1`,`Determinar el objeto, situación o caso.`],[`2`,`Determinar los objetivos (para qué observar).`],[`3`,`Determinar el modo de registro: diario de campo, cuaderno, mapas o diagramas.`],[`4`,`Registrar los datos observados.`],[`5`,`Analizar e interpretar los datos.`],[`6`,`Elaborar las conclusiones.`],[`7`,`Elaborar el informe de observación.`]]]]},

{n:`Diario de campo`,ic:`📓`,lead:`La memoria histórica, analítica y reflexiva del estudio.`,c:[
[`Instrumentos de registro`,[[`Cuaderno de notas`,`Datos, reacciones, expresiones y situaciones de interés; no tiene que ser elaborado: palabras, escenas clave y primeras y últimas observaciones de las conversaciones. Luego se organiza en el diario.`],[`Diario de campo`,`Relato de lo vivido y observado, redactado al finalizar cada jornada, con descripciones objetivas y subjetivas; de aquí sale la mayor parte de la información para el análisis por categorías.`],[`Mapa o diagrama`,`Registro gráfico del espacio.`]]],
[`¿Cómo se hace? Diez preguntas`,[[`Actor`,`¿Quién?`],[`Acto`,`¿Qué hace?`],[`Personas significativas`,`¿Con quién?`],[`Relaciones`,`¿Con quiénes?`],[`Contexto`,`¿En qué situación?`],[`Medio físico`,`¿Dónde?`],[`Objetos`,`¿Qué artefactos usa?`],[`Tiempo`,`¿Duración?`],[`Sentimientos-emociones`,`¿Cuáles, cómo los expresa?`],[`Objetivo`,`¿Para qué?`]]],
[`Por qué registrar de inmediato`,[`Consigna de forma ordenada y sistemática los hechos y las vivencias del investigador.`,`Previene el deterioro de la memoria y la pérdida de detalles relevantes, y evita que sesgos o interpretaciones posteriores distorsionen lo ocurrido.`,`Permite escribir lo que se siente y piensa sobre lo observado.`]],
[`Formato`,[[`Encabezado`,`Fecha, hora, lugar, observadores y objetivo de la observación.`],[`Aspectos objetivos`,`Descripción: quiénes estaban, qué dijeron, qué acciones hicieron, escenario físico; lo más fiel posible.`],[`Aspectos subjetivos`,`Notas reflexivas: lo que el investigador piensa, siente o intuye (hipótesis emergentes, preguntas teóricas, sesgos).`],`Separarlos evita que “contaminen la evidencia cruda” y garantiza rigor y auditabilidad.`]],
[`Ejemplo aplicado · Diario N.º 1`,[[`Contexto`,`6 de septiembre de 2025, Colegio La Playa: reunión con unos 35 padres de familia (3 hombres) para presentarse y socializar las necesidades halladas.`],[`Objetivo (extracto)`,`Se registran hora de llegada, lugar, dinámica “¿quiénes somos?”, escarapelas con nombres y asistencia.`],[`Subjetivo (extracto)`,`Incomodidad inicial por la tardanza; se observa feminización de la asistencia, lo que sugiere que el cuidado recae en las madres; la escarapela actuó como mediador simbólico.`]]]]},

[[`Los tres dominios del desarrollo`,`Las tres dimensiones desde las que se estudia el desarrollo: físico (cuerpo, cerebro, motricidad), cognitivo (percepción, memoria, lenguaje, pensamiento) y psicosocial (emociones, personalidad, relaciones).`,`Un bebé que gatea (físico) explora y aprende del entorno (cognitivo) y se aleja de su cuidador para volver a él (psicosocial).`,`Físico = cuerpo · Cognitivo = mente · Psicosocial = emociones y relaciones; se influyen entre sí.`]],
[[`El nacimiento como transición`,`Paso de la vida intrauterina a la extrauterina que reorganiza el sistema bebé–familia–entorno; no es un hecho aislado.`,`Antes: gestación. Durante: parto. Después: respirar, alimentarse y regular estados.`,`Antes – Durante – Después.`],
[`Etapas del parto`,`Tres momentos del parto, cada uno más corto que el anterior, con monitoreo fetal durante el proceso.`,`Primera etapa 12–14 h; segunda 1–2 h; tercera 10–60 min.`,`12–14 h → 1–2 h → 10–60 min.`],
[`Clasificación del parto`,`Forma de describir el parto según la gestación, cómo finaliza y cómo comienza.`,`Término (37–42 sem.) o pretérmino (28–37); eutócico (sin complicaciones) o distócico (requiere maniobras o cirugía); espontáneo o inducido.`,`Gestación · Finalización · Comienzo.`]],
[[`Evaluación neonatal`,`Escalas que valoran la condición del bebé al nacer y orientan el seguimiento.`,`APGAR (0–2 por categoría; 7–10 es alta), Silverman–Anderson (respiración), Ballard (edad gestacional), Brazelton (conducta e interacción).`,`APGAR = Apariencia, Pulso, Actividad, Respiración, Respuesta refleja.`],
[`Tamiz neonatal`,`Estrategia preventiva que detecta a tiempo enfermedades congénitas o metabólicas no evidentes en una revisión inicial.`,`Fenilcetonuria (metabólica), hipotiroidismo congénito (endocrina), fibrosis quística (pulmonar/digestiva).`,`Detectar temprano = tratar o ajustar la alimentación a tiempo.`],
[`Reflejos`,`Respuestas automáticas del recién nacido que informan sobre su organización neurológica.`,`Moro (sobresalto), búsqueda, succión, palmar, Babinski y marcha.`,`Estímulo → respuesta automática.`],
[`Estados de alerta`,`Niveles de vigilia y regulación que cambian el comportamiento del bebé.`,`Alerta tranquila, alerta activa, somnolencia, sueño ligero y sueño profundo.`,`Antes de interpretar una respuesta, pregunta en qué estado está el bebé.`]],

[[`Principios cefalocaudal y proximodistal`,`Dos direcciones generales del desarrollo motor: de la cabeza hacia los pies y del centro del cuerpo hacia afuera.`,`Controla la cabeza antes que las piernas; los brazos antes que los dedos.`,`Céfalo = cabeza→pies · Próximo = centro→afuera. No son calendarios rígidos.`],
[`Secuencia motora`,`Orden general en que el niño gana control postural y locomoción.`,`Cabeza (2–3 m) → sentarse (≈6 m) → giro, arrastre, gateo → de pie → caminar.`,`Cabeza, sentarse, gatear, caminar.`],
[`Mielinización`,`Proceso de maduración que mejora la organización y eficiencia de la comunicación neural.`,`Acompaña nuevas posibilidades de control motor y coordinación.`,`Es una pieza de la maduración, no la única explicación de la conducta.`],
[`Percepción háptica y de profundidad`,`Háptica: conocer tamaño, peso y textura al manipular. Profundidad: percibir objetos y superficies en tres dimensiones.`,`Al gatear se experimenta la profundidad; al agarrar un objeto se siente su textura.`,`Háptica = tocar · Profundidad = 3D.`],
[`Movimiento y cognición`,`Moverse genera información sensorial y nuevas oportunidades de aprender.`,`El niño alcanza y manipula un objeto y descubre sus propiedades.`,`Acción → información → construcción. Caminar no “causa” inteligencia.`]],
[[`Perspectiva piagetiana`,`El niño construye conocimiento actuando sobre el entorno; se ubica en la etapa sensoriomotriz.`,`Mira, toca, agarra y chupa; repite lo que produce efectos interesantes y lo organiza en esquemas.`,`Acción → repetición → esquemas → representación.`],
[`Procesamiento de la información`,`Enfoque que estudia cómo el niño recibe, organiza y usa la información.`,`Habituación: deja de responder a lo repetido; deshabituación: vuelve a responder ante algo nuevo.`,`Entrada → procesamiento → uso.`],
[`Enfoque conductista`,`El aprendizaje modifica la conducta por asociación de estímulos (clásico) o por sus consecuencias (operante).`,`Un bebé llora ante un sonido asociado a algo desagradable (clásico); el llanto se mantiene según la respuesta del adulto (operante).`,`Clásico = asociar estímulos · Operante = consecuencias.`],
[`Enfoque psicométrico`,`Mide el desarrollo con pruebas cuantificables de lo que el niño puede hacer.`,`Prueba de exploración del desarrollo de Denver.`,`Describe, compara y orienta; no reemplaza la observación ni el contexto.`],

[`Desarrollo del lenguaje`,`Sistema simbólico que representa la realidad ausente; crece con la maduración cerebral y la interacción.`,`Balbuceo → primera palabra (10–14 m, holofrases) → dos palabras y habla telegráfica.`,`Prelingüística → lingüística → combinación.`]],
[[`Apego`,`Vínculo emocional duradero con las figuras cuidadoras; funciona como base segura para explorar.`,`0–3 m orientación; 3–6 m interacción privilegiada; 6–12 m preferencia por figuras de apego y miedo; 12–24 m mayor independencia.`,`Conductas de apego + representación mental + sentimientos.`],
[`Erikson en 0–3 años`,`Dos crisis psicosociales: confianza vs. desconfianza (primer año) y autonomía vs. vergüenza y duda (segundo y tercer año).`,`El cuidado consistente da seguridad; después el niño quiere elegir y hacer por sí mismo.`,`Primero confiar, luego ser autónomo.`],
[`Emociones y regulación emocional`,`Las emociones se diferencian con el tiempo y la regulación pasa de ser externa (el cuidador) a propia.`,`Llanto → sonrisas → enfado, tristeza, sorpresa, miedo; hacia los 3 años inicia la autorregulación.`,`Regulación: primero con otros, luego consigo mismo.`],
[`Autoconcepto vs. autoestima`,`Autoconcepto: cómo me describo. Autoestima: cómo valoro lo que soy.`,`En 0–3 años se construyen sus bases: competencia, aceptación, reconocimiento y autonomía.`,`Descripción vs. valoración.`],
[`Autonomía`,`Participar progresivamente en las propias acciones dentro de un entorno seguro.`,`Elegir entre opciones, comer solo, decir “no”; el adulto pone límites claros y ayuda graduada.`,`Autonomía ≠ ausencia de límites.`],
[`Juego`,`Actividad con la que el niño explora, se relaciona y simboliza.`,`Motor → construcción → paralelo y simbólico.`,`Del juego individual al social y simbólico.`]]

const X2=[
[[`Técnica vs. instrumento`,`Técnicas: procedimientos concretos de recolección ligados al método inductivo. Instrumentos: medios con los que se registra lo observado o narrado.`,`La observación (técnica) se registra en un diario de campo (instrumento).`,`Técnica = cómo recolecto · Instrumento = dónde lo registro.`]],
[[`Realidad empírica vs. epistémica`,`Empírica: objetiva y material, independiente de quien la observa. Epistémica: se co-construye con un sujeto que conoce, según su cultura y contexto.`,`La investigación cualitativa asume la realidad epistémica.`,`Empírica = “afuera” · Epistémica = “construida entre todos”.`],
[`Co-construcción y subjetividad`,`El conocimiento surge del diálogo entre investigador e investigado; la subjetividad es una herramienta, no un sesgo a eliminar.`,`Las conclusiones se validan por consenso y sentido compartido.`,`Creación compartida + diseño emergente + validación dialogada.`],
[`Origen biomédico de la ética`,`La ética formal nació tras la Segunda Guerra Mundial para proteger de la experimentación no ética.`,`Núremberg, Helsinki y Belmont; trasladar ese modelo rígido a lo social ignora riesgos sutiles.`,`Núremberg · Helsinki · Belmont.`],
[`Ética vacía vs. ética situada`,`Vacía: trámite burocrático previo. Situada: compromiso vivo que se negocia en el campo con reflexividad y diálogo.`,`Renegociar el permiso con el participante durante el estudio.`,`Vacía = papel · Situada = relación.`]],
[[`Criterios de rigor`,`Seis criterios de calidad: credibilidad, transferibilidad, consistencia, confirmabilidad, relevancia y adecuación teórico-epistemológica.`,`Credibilidad se logra con observación prolongada y triangulación; consistencia, registrando las decisiones tomadas.`,`Valor de verdad · aplicabilidad · auditabilidad · reflexividad · aporte · concordancia.`],
[`Consentimiento dinámico`,`Permiso que se conversa y renueva durante el estudio, no un papel estático.`,`Volver a preguntar al participante antes de usar un dato sensible.`,`Consentimiento = proceso.`],
[`Confidencialidad y anonimato`,`Confidencialidad: proteger los datos y pedir permiso para usarlos y difundirlos. Anonimato: usar pseudónimos y evitar que las citas revelen la identidad.`,`En una comunidad pequeña, una cita textual puede delatar a la persona.`,`Proteger datos + ocultar identidad.`],
[`Ética en entrevistas y grabaciones`,`Cuidar la catarsis (silencio, empatía, sin manipular) y pedir autorización previa para audio y video, con custodia y destrucción segura.`,`Si el participante se emociona, se le acompaña sin presionar.`,`Confianza, autorización y resguardo.`]],
[[`Observación cualitativa`,`Mirar con atención sistemática la realidad social para comprenderla en su contexto natural.`,`Se observa el contexto físico, el contexto social y la interacción entre actores.`,`Físico · social · interacción.`],
[`Portero (gatekeeper)`,`Persona con autoridad formal o moral que autoriza y legitima el ingreso del investigador.`,`El líder de una comunidad que presenta al investigador ante el grupo.`,`Portero = llave de entrada y legitimidad.`],
[`Rapport`,`Relación de confianza, empatía, respeto y aceptación mutua con la comunidad.`,`Sin rapport, los participantes se ponen a la defensiva u ocultan información.`,`Primero rapport, luego observación intensiva.`],
[`Reactividad`,`Cambio del comportamiento natural cuando las personas saben que son observadas (efecto Hawthorne).`,`Se da tiempo a que el grupo se habitúe a la presencia del investigador.`,`Reactividad = conducta poco natural · Solución = tiempo.`]],
[[`Observación no participante`,`El investigador observa desde fuera, sin intervenir (perspectiva etic), apoyado a veces en una guía de observación.`,`La guía enfoca la atención (ambientes, actores, secuencias, artefactos) sin rigidez.`,`No participante = observador neutral y externo.`],
[`Auto-observación`,`El investigador o los participantes se observan y registran a sí mismos.`,`Examinar cómo mis prejuicios afectan la co-construcción de los datos.`,`Auto-observación = reflexividad.`],
[`Observación participante`,`El investigador interviene directamente con el grupo, durante un tiempo suficiente para conocer sus cotidianidades.`,`Vivir la dinámica de una comunidad y registrarla al final de cada jornada.`,`Participante = adentro y activo.`],
[`Progresión metodológica`,`La observación avanza de lo amplio a lo específico: descriptiva, enfocada y selectiva.`,`Descriptiva (¿qué pasa en general?) → enfocada (¿cómo funciona esta categoría?) → selectiva (¿qué matices refinan mi teoría?).`,`Gran angular → temática → micro; termina en saturación teórica.`],
[`Pasos de la observación`,`Siete pasos: objeto, objetivos, modo de registro, registro, análisis, conclusiones e informe.`,`Antes de ir a campo se decide qué observar, para qué y cómo registrar.`,`Qué · para qué · cómo registrar · registrar · analizar · concluir · informar.`]],

{n:`Acción sin daño`,ic:`🕊️`,lead:`Enfoque de análisis de la intervención en contextos conflictivos (Goddard, 2009; Wessells, 2009).`,c:[

[[`Decreto 0729 de 2025`,`Norma que actualiza la Política Nacional de Salud Mental; su art. 2.8.15.4 integra perspectivas para comprender a las personas, sus trayectorias, desigualdades y contextos.`,`Se cita para justificar que una intervención considere curso de vida, territorio y diversidad.`,`Decreto 0729/2025 · art. 2.8.15.4.`],

[[`Acción sin daño`,`Enfoque que analiza los impactos negativos y positivos que una intervención puede causar en el contexto; es pilar del principio de beneficencia.`,`Antes de intervenir en un conflicto comunitario, preguntarse qué efectos no deseados podría tener.`,`Evitar riesgos adicionales · leer el contexto · involucrar a beneficiarios · relaciones de calidad.`],
[`Tres pilares`,`Dignidad (todo ser humano es un fin en sí mismo), autonomía (las personas definen su proyecto de vida y sus soluciones; solo requieren apoyo) y libertad (poder decidir para realizar sus proyectos).`,`Apoyar a una comunidad para que decida su propio plan, en lugar de imponérselo.`,`Dignidad · Autonomía · Libertad.`],
[`Tipos de daños`,`Por su objeto: subjetivo, psicosomático, objetivo y al proyecto de vida. Por su naturaleza: predecibles, inevitables justificados, reparables y no reparables o difícilmente reparables.`,`Destruir los bienes de una comunidad (objetivo) frente a perder una extremidad y la ocupación (proyecto de vida).`,`Persona · cuerpo · bienes · proyecto de vida; y predecible/inevitable/reparable/irreparable.`],

[[`Práctica basada en evidencias (PBE)`,`Uso consciente, explícito y juicioso de la evidencia más actual en las decisiones con beneficiarios y comunidades; integra experiencia del profesional, valores del beneficiario y mejor evidencia.`,`Elegir una intervención combinando lo que dice la investigación, lo que sabe el profesional y lo que la persona necesita.`,`Evidencia + experiencia + valores del beneficiario.`],

[`Discriminación del estímulo`,`Capacidad de diferenciar entre estímulos similares al EC; permite respuestas específicas a estímulos concretos en el entorno.`,`El perro saliva solo ante el sonido exacto de la campana condicionada.`,`Discriminar = responder solo al estímulo exacto.`]],
[[`Corteza cerebral`,`Participa en la percepción consciente de los estímulos.`,`Percibir conscientemente el sonido de la campana.`,`Corteza: percibir de forma consciente.`],
[`Tálamo`,`Funciona como centro de relevo sensorial, enviando información a la corteza y otras estructuras.`,`La información sensorial de la campana se envía a la corteza a través del tálamo.`,`Tálamo: relevo sensorial.`],
[`Hipocampo`,`Participa en la memoria asociativa y en el reconocimiento del contexto donde ocurre la asociación.`,`Recordar en qué contexto se emparejaron la campana y la comida.`,`Hipocampo: memoria asociativa y contexto.`],
[`Amígdala`,`Clave en la asociación emocional de los estímulos, especialmente cuando el aprendizaje involucra miedo, ansiedad o placer.`,`El miedo que Laura asocia al sonido del viento.`,`Amígdala: asociación emocional.`],
[`Cerebelo`,`Esencial en el condicionamiento de respuestas motoras simples (parpadeo, salivación); integra señales sensoriales y motoras para coordinar respuestas automáticas aprendidas.`,`Parpadear ante un estímulo que antes se asoció con algo que provoca el parpadeo.`,`Cerebelo: respuestas motoras simples aprendidas.`],
[`Tronco encefálico y sistema límbico`,`Participan en la regulación de reflejos automáticos (como la salivación) y en la integración de respuestas fisiológicas; el núcleo del tracto solitario y el núcleo salival intervienen en la producción de saliva ante estímulos condicionados.`,`La producción de saliva cuando suena la campana condicionada.`,`Tronco y límbico: reflejos automáticos como la saliva.`],
[`Plasticidad sináptica y LTP`,`La plasticidad neural es la capacidad de las neuronas de modificar la fuerza de sus conexiones sinápticas con la experiencia; la potenciación a largo plazo (LTP) hace que respondan con más eficiencia a estímulos antes neutros asociados con estímulos significativos.`,`Tras emparejar campana y comida, las neuronas responden con más eficiencia a la campana.`,`Plasticidad: sinapsis que cambian. LTP: respuesta más eficiente.`]]
];

{n:`Inicio`,ic:`📘`,lead:`Evaluación cualitativa · Corte 1 · Fundamentos epistemológicos y lógica de la investigación cualitativa`,c:[
[`¿De qué trata?`,[`La investigación es un proceso dinámico condicionado por su naturaleza reflexiva, por fuerzas externas (razones científicas, económicas, sociales y políticas), por el factor humano (el juicio del investigador) y por su impacto académico, social, económico y político.`]],
[`Cuatro hitos de aprendizaje para dominar el diseño cualitativo`,[[`Reconoce`,`Los fundamentos teóricos y epistemológicos, y su valor para comprender la realidad socio-humana.`],[`Comprende`,`La lógica, flexibilidad y rigurosidad del proceso cualitativo en la ciencia contemporánea.`],[`Analiza`,`Los diferentes diseños cualitativos para evaluar su coherencia frente a un problema.`],[`Aplica`,`Los componentes del diseño en la fundamentación de una propuesta ética y situada.`]]],

{n:`Realidad empírica y epistémica`,ic:`🔎`,lead:`Existen dos lentes fundamentales para decodificar la realidad que investigamos.`,c:[
[`Evolución del pensamiento científico`,[[`Filosofía e Historia · Edad Media–S.XVIII`,`Inicia la formalización de las ciencias sociales.`],[`Positivismo · mediados S.XIX–ppios. S.XX`,`Consolidación en ciencias sociales; los hechos sociales se estudian como “cosas” externas.`],[`Física Cuántica y Racionalismo Crítico · S.XX`,`Incertidumbre del conocimiento absoluto. El neopositivismo de Popper propone la falsación y la refutabilidad: las teorías se vuelven provisionales, no se puede conocer la realidad "tal cual es".`],[`El Giro Cualitativo · Actualidad`,`Aportes desde la sociología y la psicología para entender la realidad a través de los significados y las subjetividades.`]]],
[`Tres miradas sobre lo humano`,[[`Émile Durkheim · Positivismo`,`El humano como objeto: los fenómenos sociales son "cosas" con influencia externa; existe una inespecificidad de "lo humano" frente a otras realidades.`],[`Max Weber · El punto medio`,`Comprensión + explicación: busca la comprensión interpretativa de la acción social para obtener una explicación causal. La explicación depende de la interpretación.`],[`Edmund Husserl · Fenomenología`,`El humano como sujeto de sentido: la realidad humana es específica e irreductible a lo físico; exige captar el sentido (sujeto, subjetividad, significación).`]]],
[`El puente de Weber`,[`"Una ciencia que aspira a la comprensión interpretativa de la acción social para obtener la explicación causal de su curso y efectos." La pretensión explicativa depende de la tarea interpretativa: la comprensión es un tipo de explicación distinta.`]],
[`Dos lentes fundamentales`,[[`Realidad empírica`,`Lo objetivo y material. Basada en lo que se percibe a través de los sentidos; el conocimiento se construye observando la manifestación física del fenómeno.`],[`Realidad epistémica`,`La construcción cultural. Requiere un sujeto cognoscente; está influenciada por la cultura, el contexto y las relaciones sociales particulares.`]]],
[`Dos dimensiones de una misma observación`,[`Ante una fotografía de un barrio de casas de zinc: la realidad empírica describe lo tangible (casas de zinc, ropa colgada, caminos de tierra, topografía árida), mientras la realidad epistémica interpreta significados (desigualdad estructural, tejido social comunitario, exclusión urbana, resiliencia).`]]]},

{n:`Posturas del investigador y rutas metodológicas`,ic:`🧭`,lead:`La postura del investigador define su grado de interacción con el objeto de estudio.`,c:[
[`Modelo cuantitativo vs. cualitativo`,[[`Modelo cuantitativo (S → O)`,`Distancia y no interacción como condición de rigor. Permite excluir juicios valorativos y la visión propia.`],[`Modelo cualitativo (S ⇄ O)`,`El conocimiento es una creación compartida mediante la interacción. Hace absolutamente necesario "meterse en la realidad".`]]],
[`El perfil del investigador se adapta a su búsqueda`,[[`Perfil cuantitativo`,`Empírico, objetivo, cantidad numérica, distante.`],[`Perfil cualitativo`,`Epistémico, interactivo, interpretativo, cualidades.`]]],
[`Dos paradigmas metodológicos`,[[`¿Cómo se construye?`,`Ruta cuantitativa: desde la estadística, con uso estructurado y riguroso de métodos y herramientas de recolección. Ruta cualitativa: a partir de sucesivos hallazgos durante la investigación, sobre la marcha.`],[`¿Cómo se valida?`,`Ruta cuantitativa: comprobación de hipótesis estructuradas y análisis numérico. Ruta cualitativa: a través del diálogo, la interacción continua y la vivencia en campo.`],[`¿Rol de la teoría y los conceptos?`,`Ruta cuantitativa: actúan como guía y punto de partida estricto. Ruta cualitativa: la teoría es la meta final, no el punto de partida.`]]],
[`La alineación de la investigación cualitativa`,[`El mandato de Weber (comprender para explicar) conduce a la realidad epistémica (el tejido de significados), que se aborda mediante la ruta cualitativa: las herramientas de Sampieri, vehículo metodológico para alcanzar la comprensión interpretativa de la realidad epistémica.`]]]},

{n:`Planteamiento del problema`,ic:`❓`,lead:`La lógica de la investigación cualitativa: del problema a la pregunta y los objetivos.`,c:[
[`Características del investigador cualitativo`,[`Subjetividad, sensibilidad, capacidad interactiva, flexibilidad, empatía, manejo de etapas circulares e interpretación bidireccional. Las ideas de investigación surgen de experiencias, el entorno, la curiosidad, creencias, opiniones y motivaciones.`]],
[`Definición del problema`,[[`¿Qué es un problema?`,`Una cuestión compleja que requiere una solución; un hecho no resuelto que debe encontrar una respuesta teórica, práctica o científica.`],[`Criterios`,`Filosófico: basado en antecedentes históricos. Científico: expresión objetiva de la necesidad de desarrollar conocimiento científico.`],[`Tipos`,`Empíricos vs. conceptuales. Generales, específicos y particulares.`]]],
[`El planteamiento`,[`La dirección y el propósito: delimita la estrategia para identificar el camino y cubrir las deficiencias de conocimiento. Se apoya en un contexto conceptual (el sistema de conceptos, supuestos, creencias y teorías que respaldan el diseño), construido a partir de la experiencia del investigador, su dominio del tema y estudios previos. Ejemplo: para investigar una cultura indígena, primero hay que conocer su radicación, historia, religión y economía.`]],
[`La pregunta`,[`El corazón del diseño: indica qué se desea saber y la dirección de la investigación. Debe ser modificable, clara y delimitada en tiempo y espacio para poder responderse. La paradoja cualitativa: presentar interrogantes que son solicitados por las agencias financiadoras pero que admiten flexibilidad.`]],
[`¿Qué? y ¿Por qué?`,[[`¿Qué? · El planteamiento del problema`,`Enuncia la dirección y el vacío de conocimiento.`],[`¿Por qué? · La justificación`,`Relevancia sustentada a través de los aportes teórico, metodológico y social.`],[`Objetivos generales`,`Enmarcan toda la investigación.`],[`Objetivos específicos`,`Señalan los pasos exactos a seguir para alcanzar el objetivo general.`]]],
[`Espectro de alcances (scope spectrum)`,[[`Exploratoria`,`Primera aproximación al fenómeno.`],[`Descriptiva`,`Características del fenómeno, sin hipótesis.`],[`Explicativa`,`Identificar factores o influencias.`],[`Predictivos`,`Determinar la configuración futura.`],[`De intervención`,`Transformar una realidad.`],[`De evaluación`,`Medir consecuencias y efectos.`]]],
[`Fórmula del objetivo`,[`[Verbo en infinitivo] + [Fenómeno central] + [Participantes] + [Contexto/Ambiente] + [Propósito]. Verbos frecuentes: explorar, entender, identificar, profundizar, comprender, examinar. Ejemplo: "Comprender las vivencias emocionales de pacientes jóvenes en un hospital público para afrontar la enfermedad." Objetivos específicos derivados: explorar significados del diagnóstico, identificar apoyo familiar, analizar percepción de atención humanizada.`]]]},

{n:`Fenomenología y Hermenéutica`,ic:`🌀`,lead:`Dos diseños centrados en el significado: la vivencia subjetiva y la interpretación del discurso.`,c:[
[`Fenomenología: devela el significado de la subjetividad`,[`Fundada en el siglo XX por Edmund Husserl, este enfoque asume la investigación sistemática de la subjetividad y del mundo de la vida cotidiana.`]],
[`Tareas fundamentales del investigador fenomenológico`,[[`Estudiar las esencias`,`Develar la verdadera naturaleza profunda de los fenómenos.`],[`Explorar el significado del ser`,`Comprender la esencia misma de ser humano.`],[`Conocer significados particulares`,`Interpretar las experiencias según las narran los sujetos (Van Manen, 1990).`],[`Reflexión de la conciencia`,`Develar sistemáticamente lo que ocurre en la esfera consciente.`]]],
[`La épóché`,[`Concepto clave: pretende suspender de forma sistemática e intencional las creencias del investigador. Su propósito central es obtener los fenómenos sociales y psicológicos libres de toda adulteración o interpretación teórica previa. Se alcanza en el estado llamado "actitud ingenua o natural". Principio epistemológico: "Una verdadera ciencia sigue siempre la naturaleza de lo que ha de ser investigado, y nunca sus propias preocupaciones y dogmas metodológicos".`]],
[`¿Qué es la hermenéutica?`,[`Durante el siglo XX inició enfocada en la interpretación de textos complejos, especialmente de carácter bíblico. Posteriormente se trasladó a las ciencias sociales con un propósito más ambicioso: interpretar discursos y acciones reconstruyendo sistemáticamente la intención del autor, y analizar las problemáticas y vidas de los sujetos según los aspectos culturales e históricos que los permean.`]],
[`El método hermenéutico y el círculo de la comprensión`,[`Arte de interpretar: enfoque exploratorio y reflexivo con técnicas múltiples para acceder al discurso social; su meta no es la generalización positivista, sino la comprensión del sentido profundo de los fenómenos humanos reales. El investigador transita constantemente de las partes (fragmentos, relatos específicos, palabras, metáforas cotidianas) al todo (comprensión global, estructura histórica y contexto de la cultura), en un diálogo de horizontes entre el investigador y los actores sociales.`]]]},

{n:`Etnografía e IAP`,ic:`🌍`,lead:`Dos diseños centrados en la cultura de un grupo y en la transformación social.`,c:[
[`La etnografía`,[`Forma cualitativa de investigación que busca describir, traducir, explicar e interpretar de forma sistemática las realidades socioculturales de un grupo humano que comparte un entorno o una filosofía de gestión común: compartir realidades comunes y examinar minuciosamente comportamientos, sistemas de valores, creencias, rituales y dinámicas del lenguaje. Requiere que el investigador se inserte de manera directa y respetuosa en el entorno cotidiano del grupo para captar su cultura viva.`]],
[`Tipología y diseños de investigación etnográfica`,[[`Etnografías clásicas`,`Analizan posiciones ideológicas y dinámicas considerando toda la cultura en conjunto.`],[`Micro-etnografías`,`Se centran de forma intensiva en un aspecto específico de la cultura o una situación social concreta.`],[`Macro-etnografías`,`Consideran la cultura global en su conjunto, integrando dinámicas históricas y de gran escala.`],[`Diseños mixtos`,`Recogen y combinan sistemáticamente datos cualitativos y cuantitativos.`],[`Etnografías críticas`,`Estudian de forma prioritaria a grupos marginados para contribuir a resolver injusticias e inequidades (Madison, 2011).`]]],
[`¿Qué es la Investigación-Acción Participativa (IAP)?`,[`Creada e impulsada por el sociólogo colombiano Orlando Fals Borda, marca una ruptura con la investigación positivista tradicional. Finalidad dual: no busca únicamente describir o interpretar la realidad social, sino resolver de forma inmediata problemas prácticos de una comunidad y, simultáneamente, transformar y emancipar dicha realidad por la acción colaborativa. Co-construcción del saber: se investiga y reflexiona críticamente mientras se producen e implementan soluciones colectivas reales. Sigla: I (Investiga) - A (Acciones de forma interventiva) - P (Participan absolutamente todos).`]],
[`Principios horizontales de la IAP`,[[`Relación sujeto-sujeto`,`No existe una relación asimétrica o de poder entre el investigador y la comunidad; se asume la horizontalidad democrática mutua.`],[`Visión práctica de mejora`,`Foco prioritario en el desarrollo y mejora de las prácticas comunitarias mediante la reflexión crítica constante.`],[`Visión emancipadora`,`Énfasis en la sensibilización política, la lucha colectiva contra la opresión social y la horizontalidad de saberes.`],[`Coinvestigación activa`,`Los miembros de la comunidad no son objetos pasivos de estudio, sino coinvestigadores con toma de decisiones.`]]],
[`Fases secuenciales de la intervención en IAP`,[[`Fase 1 · Sensibilización`,`Acercamiento inicial respetuoso al campo social para motivar la participación democrática e informada de todos los miembros.`],[`Fase 2 · Problematización y diagnóstico`,`Identificación rigurosa de las necesidades, problemas y prioridades de la comunidad mediante técnicas dialógicas.`],[`Fase 3 · Plan de acción`,`Formulación colaborativa de estrategias transformadoras y ejecución activa del plan acordado en asambleas.`],[`Fase 4 · Evaluación permanente`,`Proceso continuo y transversal de monitoreo, evaluación de aprendizajes y retroalimentación para ajustar las acciones.`]]]]},

{n:`Teoría Fundamentada`,ic:`🧩`,lead:`Un abordaje cualitativo donde el diseño es emergente y flexible; su propósito es "producir una teoría explicativa" que nace directamente de los datos empíricos en su contexto natural (Hernández-Sampieri y Mendoza, 2018).`,c:[
[`Niveles de teoría: sustantivas vs. formales`,[[`Teorías sustantivas (intermedias)`,`Se aplican a un contexto, población o área temática específica; surgen directamente del trabajo de campo situado y explican un fenómeno delimitado. Ejemplos: la teoría del cuidado de enfermos (Morse, 1999) y la teoría sobre abuso sexual infantil en mujeres adultas (Morrow y Smith, 1995).`],[`Teorías formales`,`Poseen mayor nivel de abstracción y aplican a rangos más amplios de situaciones sociales, biológicas o físicas. Ejemplos: la teoría de la atribución social y la teoría general de la evolución (Darwin y Wallace).`]]],
[`Variantes del diseño metodológico`,[[`Diseño sistemático (Strauss & Corbin)`,`Estructurado y riguroso. Utiliza codificación abierta, axial y selectiva, guiada por el "paradigma codificador" preestablecido de causas, contexto y consecuencias.`],[`Diseño emergente (Glaser)`,`Fluido y libre. Critica la rigidez sistemática por "forzar" los datos; las categorías se conectan sin encasillarse, la teoría surge de manera espontánea.`],[`Diseño constructivista (Charmaz)`,`Interpretativo y reflexivo. Énfasis en la intersubjetividad y los significados; la teoría es una "co-construcción" entre el investigador y los participantes.`]]],
[`Aplicaciones prácticas y multidisciplinares`,[[`Empresa y organización (Turner, 2014)`,`Análisis de dinámicas reales de gestión, liderazgo y toma de decisiones corporativas desde la experiencia directa.`],[`Hábitat urbano`,`Investigación de la vivencia en conjuntos residenciales para fundamentar el diseño de ambientes sustentables orientados al bienestar.`],[`Salud y clínica (Bogner et al., 2008)`,`Estudios longitudinales de pacientes para orientar mejoras en la atención y el soporte integral.`],[`Intervención psicosocial (Caso Kasimba)`,`Explica cómo jóvenes en entornos vulnerables utilizan la danza como mecanismo de resistencia socioemocional y reconstrucción comunitaria.`]]],
[`El proceso de codificación en la Teoría Fundamentada`,[[`1 · Codificación abierta`,`Fragmentación profunda de los datos empíricos, línea por línea, para identificar conceptos preliminares y agrupar declaraciones similares en categorías. Ejemplo: la frase "me encierro en casa por las peleas de mis tíos" se codifica como "conflicto intrafamiliar / aislamiento doméstico".`],[`2 · Codificación axial`,`Interconexión de las categorías en torno a un eje explicativo central, relacionando categorías y subcategorías mediante el paradigma codificador (causas, condiciones, estrategias). Ejemplo: conectar violencia familiar (causa) → Plaza de la Paz (refugio/estrategia) → identidad Kasimba (consecuencia).`],[`3 · Codificación selectiva`,`Identificación, refinamiento y selección de una única categoría central que articula e integra todas las categorías en una narrativa lógica, generando la teoría emergente final. Ejemplo: "La práctica dancística como trinchera y espacio de resignificación de la identidad joven" del grupo Kasimba.`]]]]},

{n:`Caso Kasimba y aplicación`,ic:`🎯`,lead:`Aplicar los componentes del diseño cualitativo en la fundamentación epistemológica de una propuesta de investigación ética y situada.`,c:[
[`Estudios de caso trabajados en clase`,[[`Víctimas del conflicto`,`Enfoque: resiliencia y perdón. Pregunta: ¿existe relación entre los factores personales de resiliencia y la disposición a perdonar a exvictimarios, en mujeres adultas víctimas radicadas en el Atlántico?`],[`Comedores parroquiales`,`Enfoque: efectos en el voluntariado (extrema pobreza). Preguntas: ¿cuáles son los efectos sobre los voluntarios? ¿cómo perciben la experiencia cotidiana?`],[`Caso Kasimba`,`Enfoque: significado y pertenencia organizacional. Preguntas: ¿qué significa para la profesora Iveth su trabajo? ¿cómo perciben los jóvenes el pertenecer a la organización?`]]],
[`Eje problematizador del curso`,[`¿Cómo puede el psicólogo en formación explicar e interpretar fenómenos individuales y colectivos complejos que emergen en contextos sociales y organizacionales diversos, integrando los procesos cognitivos, las dinámicas sociales y el ciclo vital, para fundamentar decisiones profesionales éticas, contextualizadas y basadas en evidencia que respondan de manera pertinente a las necesidades de las personas, los grupos y las organizaciones?`]],
[`Fórmula de la pregunta problema`,[`[Adverbio o verbo exploratorio: ¿Cómo...?, ¿De qué manera...?, ¿Qué procesos...?, ¿Cuál es el significado...?] + [Fenómeno central: la resiliencia, la resistencia cultural, la vivencia del duelo, la identidad profesional] + [Participantes: quiénes son las personas o comunidades cuyos significados y vivencias se van a explorar] + [Contexto/Ambiente: lugar o contexto delimitado donde se recolectarán los datos]. Ejemplo: "¿Cómo perciben y significan los docentes de psicología de la Universidad de la Costa las dinámicas de estrés laboral dentro de sus prácticas pedagógicas cotidianas?"`]],
[`Directrices de la rúbrica de trabajo · Día 3 (Caso Kasimba)`,[`Selección del problema psicosocial: identificar de manera rigurosa y fundamentada una problemática cualitativa del caso en estudio. Formulación de la pregunta de investigación cualitativa. Escoger un diseño cualitativo para el abordaje de la problemática.`]],
[`Lecturas para la sumativa del Corte 1`,[`Capítulo 14: "Elección del diseño en la ruta cualitativa" (Hernández Sampieri y Mendoza, 2023). Lectura del caso Kasimba y revisión del referente teórico.`]]]}
];

[[`Positivismo`,`Corriente consolidada entre mediados del siglo XIX y principios del XX; estudia los hechos sociales como "cosas" externas al investigador.`,`Contar cuántas personas viven en pobreza en una ciudad, como un dato objetivo y medible.`,`Positivismo: los hechos como cosas externas.`],
